 **red**. El emisor mantiene una ventana de congestión (cwnd) propia: empieza pequeña (**slow start**, crece exponencialmente), luego crece de forma lineal (**congestion avoidance**) y se reduce cuando detecta pérdida. Algoritmos: Reno, CUBIC (por defecto en Linux y Windows), BBR. El emisor envía el mínimo entre la ventana del receptor y cwnd."],note:"Control de flujo ≠ control de congestión. El primero evita saturar al receptor; el segundo, a la red. Es una pregunta frecuente de entrevista."},{id:"mss",title:"MSS vs. MTU",level:"Intermediate",body:["La **MTU** (capa 2/3) es el tamaño máximo del **paquete IP** que cabe en una trama: 1500 bytes en Ethernet. El **MSS** (capa 4) es el tamaño máximo de **datos** que TCP mete en un segmento, sin contar encabezados IP ni TCP.","Con IPv4 y TCP sin opciones: MSS = 1500 − 20 (IP) − 20 (TCP) = **1460**. Con IPv6: 1500 − 40 − 20 = 1440. Cada lado anuncia su MSS en el SYN. En túneles (VPN, PPPoE con MTU 1492) los routers suelen reescribir el MSS (**MSS clamping**) para evitar fragmentación."]},{id:"udp",title:"UDP y sus casos de uso",level:"Beginner",body:["Encabezado de **8 bytes**: puerto origen, puerto destino, longitud y checksum. Sin conexión, sin ACKs, sin orden, sin control de flujo ni de congestión. Cada `send()` es un datagrama independiente.","Se usa cuando la rapidez importa más que la fiabilidad, o cuando la aplicación prefiere manejar la fiabilidad a su manera: **DNS** (una pregunta y una respuesta pequeñas; usa TCP si la respuesta es grande o para transferencias de zona), **juegos en línea** (la posición vieja no sirve), **VoIP y videollamadas** (RTP sobre UDP), **streaming en vivo**, **DHCP**, **NTP**, **SNMP** y **QUIC**."],table:{head:["","TCP","UDP"],rows:[["Conexión","Sí (handshake)","No"],["Fiabilidad","ACKs y retransmisión","Ninguna"],["Orden","Garantizado","No garantizado"],["Control de flujo/congestión","Sí","No"],["Encabezado","20–60 bytes","8 bytes"],["Unidad","Flujo de bytes → segmentos","Mensajes → datagramas"],["Ejemplos","HTTP/1.1–2, SSH, SMTP, bases de datos","DNS, VoIP, juegos, DHCP, QUIC"]]}},{id:"quic",title:"QUIC y HTTP/3",level:"Expert",body:["**QUIC** es un protocolo de transporte moderno que corre sobre **UDP** (normalmente puerto 443). Implementa por sí mismo lo que TCP hacía en el kernel: conexión, fiabilidad, control de flujo y de congestión, pero en espacio de usuario, lo que permite evolucionarlo rápido.","Integra **TLS 1.3** dentro de su handshake: conexión y cifrado se negocian a la vez, en 1 RTT (o 0-RTT en reconexiones). Casi todo su encabezado va cifrado. Tiene **varios flujos (streams) independientes**: una pérdida en un flujo no bloquea a los demás, eliminando el bloqueo de cabeza de línea (head-of-line blocking) que sufre HTTP/2 sobre TCP. Sus conexiones usan un **Connection ID**, así que sobreviven a un cambio de red (de Wi-Fi a datos móviles).",'**HTTP/3** es HTTP sobre QUIC. En términos OSI: UDP en capa 4, QUIC también hace funciones de capa 4 (y de "sesión"), TLS 1.3 aporta cifrado (capa 6 en el modelo didáctico) y HTTP/3 en capa 7. Es un buen ejemplo de por qué los protocolos modernos no encajan limpiamente en una sola capa.'],note:"Un firewall que bloquea UDP 443 no rompe la web: el navegador vuelve a HTTP/2 sobre TCP 443."}],protocols:[{name:"TCP",what:"Transporte orientado a conexión y fiable.",how:"Handshake, secuencias, ACKs, retransmisiones, ventanas, control de congestión.",use:"Web (HTTP/1.1, HTTP/2), SSH, correo, bases de datos, transferencias de archivos.",relation:"Encapsulado en IP (protocolo 6).",port:"IP proto 6"},{name:"UDP",what:"Transporte sin conexión y mínimo.",how:"Solo puertos, longitud y checksum.",use:"DNS, DHCP, VoIP, juegos, streaming, QUIC.",relation:"Encapsulado en IP (protocolo 17).",port:"IP proto 17"},{name:"QUIC",what:"Transporte cifrado multiplexado sobre UDP.",how:"Streams independientes, TLS 1.3 integrado, Connection IDs.",use:"HTTP/3, servicios de Google, Cloudflare, Meta.",relation:"Va sobre UDP; mezcla funciones de capa 4, 5 y 6."},{name:"SCTP",what:"Transporte fiable orientado a mensajes con multihoming.",how:"Asociaciones con varias IPs y varios streams.",use:"Señalización de telefonía móvil, WebRTC data channels (encapsulado).",relation:"Alternativa poco común a TCP."}],hardware:[{name:"Sistema operativo (kernel)",desc:"Implementa TCP y UDP; expone la API de sockets (`socket()`, `bind()`, `listen()`, `connect()`)."},{name:"Firewall stateful",desc:"Sigue el estado de cada conexión TCP/UDP y permite el tráfico de vuelta de conexiones iniciadas desde dentro."},{name:"Balanceador de carga L4",desc:"Reparte conexiones entre servidores por IP y puerto, sin mirar el contenido HTTP."},{name:"Router con NAT/PAT",desc:"Reescribe puertos de origen: trabaja también en capa 4."},{name:"NIC con offload",desc:'Muchas tarjetas segmentan (TSO) y calculan checksums por hardware; por eso a veces Wireshark muestra "checksum incorrect" en paquetes salientes.'}],examples:[{title:"Abrir dos pestañas del mismo sitio",text:"Tu PC abre dos conexiones a 142.250.x.x:443 desde dos puertos efímeros distintos (por ejemplo 52314 y 52315). El servidor distingue cada conexión por la tupla de 5."},{title:"Videollamada",text:"El audio y el video viajan en RTP sobre UDP. Si un paquete se pierde, el códec lo disimula; retransmitirlo llegaría tarde."},{title:"Descargar un archivo",text:"TCP empieza lento (slow start), acelera, y si hay pérdidas reduce la velocidad. Por eso la barra de descarga sube poco a poco al principio."}],security:[{name:"Escaneo de puertos",how:'Descubrir qué servicios escuchan. Conceptualmente: `nmap -sT` completa el handshake; `nmap -sS` (SYN scan, "medio abierto") envía SYN y, al recibir SYN-ACK, responde RST sin completar la conexión. Respuestas: SYN-ACK = abierto, RST = cerrado, nada = filtrado. Solo en sistemas propios o con autorización.',detect:"Muchos SYN a puertos distintos desde un mismo origen, SYN sin ACK final, alertas de IDS.",defend:"Exponer solo los servicios necesarios, firewall con política por defecto de denegar, IDS/IPS."},{name:"Escaneo UDP",how:'`nmap -sU`: si el puerto está cerrado, el host suele responder ICMP "port unreachable"; si no hay respuesta, queda "open|filtered", porque UDP no confirma nada. Es lento por los límites de ICMP.',detect:"Ráfagas de UDP a muchos puertos y muchos ICMP port unreachable salientes.",defend:"Filtrar UDP no necesario, limitar respuestas ICMP."},{name:"SYN flood (DoS)",how:"Enviar enormes cantidades de SYN (a menudo con IP de origen falsa) para llenar la cola de conexiones a medio abrir (SYN_RECEIVED) del servidor.",detect:"Muchísimos sockets en SYN_RECV (`ss -s`, `netstat`), SYN sin ACK.",defend:"SYN cookies, límites de tasa, protección anti-DDoS del proveedor."},{name:"Agotamiento de conexiones",how:"Abrir y mantener muchas conexiones lentas (estilo Slowloris en HTTP) o agotar puertos efímeros en un proxy o NAT.",detect:"Conexiones ESTABLISHED que crecen sin tráfico, límites de file descriptors alcanzados.",defend:"Timeouts agresivos, límite de conexiones por IP, proxy inverso."},{name:"Inyección y RST spoofing",how:"Enviar un RST o datos falsos en una conexión ajena; requiere adivinar la tupla y una secuencia dentro de la ventana.",detect:"RST inesperados, conexiones que se cortan sin motivo.",defend:"ISN aleatorios, validación estricta de secuencias, cifrado (TLS) para que los datos inyectados sean rechazados."}],troubleshooting:{symptoms:['"Connection refused".','"Connection timed out".',"El servicio responde por ping pero la aplicación no conecta.","Descargas lentas con muchas retransmisiones.","Muchísimas conexiones en CLOSE_WAIT o TIME_WAIT.","El handshake nunca termina (SYN sin respuesta o sin ACK final)."],causes:["Servicio detenido o escuchando en otra IP/puerto (por ejemplo solo en 127.0.0.1).","Firewall del host o de red descartando el puerto.","Ruta de regreso asimétrica que un firewall stateful bloquea.","Pérdida de paquetes o congestión en el camino.","Aplicación que no cierra sockets (CLOSE_WAIT)."],tools:[{cmd:"ss -tulpn  (Linux)",desc:"Puertos TCP/UDP en escucha y qué proceso los usa. `ss -tan` muestra estados."},{cmd:"netstat -ano  (Windows)",desc:"Conexiones, estados y PID del proceso."},{cmd:"lsof -i :443  (Linux/macOS)",desc:"Qué proceso tiene abierto ese puerto."},{cmd:"Test-NetConnection host -Port 443  (PowerShell)",desc:"¿Se completa el handshake TCP? Muestra TcpTestSucceeded."},{cmd:"nc -vz host 443",desc:"Prueba rápida de conexión a un puerto."},{cmd:"curl -v https://host",desc:"Muestra la conexión TCP, TLS y la respuesta HTTP."},{cmd:'tcpdump -n "tcp port 443"  /  Wireshark',desc:"Ver SYN, SYN-ACK, RST, retransmisiones y ventanas."},{cmd:"nmap -p 443 host  (autorizado)",desc:"Estado del puerto: open, closed, filtered."}],procedure:["Confirma la capa 3: ¿responde la IP (o al menos el camino es correcto)?","En el servidor, comprueba que el servicio escucha en el puerto y en la IP correctos (`ss -tulpn`). 0.0.0.0 = todas las interfaces; 127.0.0.1 = solo local.","Desde el cliente, prueba el puerto (Test-NetConnection, nc, curl).","Distingue refused (RST: el host respondió) de timeout (nada: filtrado o sin ruta).","Captura tráfico en ambos extremos para ver dónde se pierde el SYN o el SYN-ACK.","Revisa firewalls del host y de red, y grupos de seguridad en la nube."],interpret:["SYN → RST: puerto cerrado (connection refused).","SYN → (nada) → SYN retransmitido: filtrado o sin ruta (timeout).","SYN → SYN-ACK → (sin ACK): el cliente no recibe el SYN-ACK o un firewall lo bloquea en el regreso.","Muchos `Dup ACK` y `Retransmission`: pérdida de paquetes.","`ZeroWindow`: la aplicación receptora no está leyendo lo bastante rápido."],differentiate:"Si ping funciona pero el puerto no, el problema está en la capa 4 (servicio, firewall de puertos). Si el handshake TCP se completa pero la página falla, sube a TLS o HTTP. Si ni siquiera hay respuesta ICMP ni ARP, baja a la capa 3 o 2."},quiz:[{q:"¿Qué identifica un número de puerto?",options:["Un equipo en la red","Un proceso o servicio dentro de un equipo","Una red","Una VLAN"],answer:1,why:"La IP identifica al equipo; el puerto, a la aplicación dentro de él.",level:"Beginner"},{q:"Orden correcto del handshake TCP:",options:["SYN → ACK → SYN-ACK","SYN → SYN-ACK → ACK","ACK → SYN → FIN","SYN-ACK → SYN → ACK"],answer:1,why:"El cliente envía SYN, el servidor SYN-ACK y el cliente confirma con ACK.",level:"Beginner"},{q:'El cliente recibe "connection refused" al instante. ¿Qué ocurrió?',options:["El servidor respondió con RST: el puerto está cerrado","Un firewall descartó el SYN en silencio","DNS no resolvió","TTL agotado"],answer:0,why:"Refused = llegó un RST. Si un firewall descartara el SYN, verías un timeout.",level:"Intermediate"},{q:"¿Por qué DNS usa normalmente UDP?",options:["Porque UDP cifra los datos","Porque son consultas pequeñas de pregunta-respuesta y evitar el handshake reduce la latencia","Porque TCP no tiene puertos","Porque UDP garantiza la entrega"],answer:1,why:"Una consulta y una respuesta caben en un datagrama. Para respuestas grandes o transferencias de zona usa TCP.",level:"Beginner"},{q:"MTU 1500, IPv4 y TCP sin opciones. ¿Cuál es el MSS?",options:["1500","1480","1460","1440"],answer:2,why:"1500 − 20 (IP) − 20 (TCP) = 1460.",level:"Intermediate"},{q:"¿Cuál es la diferencia entre control de flujo y control de congestión?",options:["Son sinónimos","Flujo protege al receptor; congestión protege a la red","Flujo es de UDP y congestión de TCP","Congestión protege al receptor"],answer:1,why:"La ventana del receptor limita por su buffer; cwnd limita según el estado de la red.",level:"Advanced"},{q:"Un servidor tiene miles de sockets en CLOSE_WAIT. ¿Qué sugiere?",options:["Un ataque SYN flood","Que la aplicación no está cerrando los sockets tras recibir el FIN del cliente","Un problema de MTU","Que el DNS está caído"],answer:1,why:"CLOSE_WAIT significa que el otro extremo cerró y nuestra aplicación aún no llamó a close().",level:"Expert"},{q:"En un SYN scan, ¿qué indica recibir SYN-ACK?",options:["Puerto cerrado","Puerto abierto","Puerto filtrado","Host apagado"],answer:1,why:"SYN-ACK = alguien escucha. RST = cerrado. Sin respuesta = filtrado.",level:"Advanced"},{q:"¿Sobre qué protocolo de transporte corre QUIC (y por tanto HTTP/3)?",options:["TCP","UDP","ICMP","SCTP"],answer:1,why:"QUIC corre sobre UDP e implementa por encima fiabilidad, control de congestión y TLS 1.3.",level:"Advanced"}],lab:{title:"Captura un three-way handshake",where:"Tu computadora + Wireshark",goal:"Ver con tus propios ojos SYN, SYN-ACK, ACK, los números de secuencia y el cierre con FIN.",steps:["Abre Wireshark en tu interfaz y aplica el filtro `tcp.port == 80`.","En una terminal ejecuta `curl -v http://example.com` (es HTTP sin cifrar, así ves todo).","Detén la captura. Localiza los tres primeros paquetes: [SYN], [SYN, ACK], [ACK].",'En cada uno, abre la sección "Transmission Control Protocol" y anota Sequence Number, Acknowledgment Number y las flags. Wireshark muestra números relativos; activa "raw" para ver los reales.',"Busca el segmento con la petición GET (flags PSH, ACK) y su tamaño.","Al final, busca los [FIN, ACK] del cierre.","Ejecuta `ss -tan` o `netstat -an` justo después y busca conexiones en TIME_WAIT."],expected:"Verás seq=0 y ack=0 relativos en el SYN, seq=0 ack=1 en el SYN-ACK y seq=1 ack=1 en el ACK. Tras cerrar, tu lado (si cerró primero) quedará unos segundos en TIME_WAIT."}},n1={n:5,key:"sesion",name:"Sesión",en:"Session",pdu:"Datos",color:"l5",hex:"#8492f2",tagline:"Establece, mantiene, sincroniza y termina diálogos entre aplicaciones.",keyPoints:["Una sesión es un diálogo lógico que puede durar más que una conexión TCP y sobrevivir a varias.","Funciones clásicas: establecer, mantener y terminar; control de diálogo; sincronización con checkpoints.","En redes modernas es mayormente conceptual: sus funciones viven en TCP, TLS, QUIC y las aplicaciones.","Conexión TCP ≠ sesión web ≠ sesión de autenticación.","Stateful: el servidor recuerda el contexto. Stateless: cada petición trae todo lo necesario (por ejemplo, un token)."],intro:{que:"La capa que organiza el diálogo entre dos aplicaciones: cuándo empieza, quién habla, cómo se retoma si se interrumpe y cuándo termina.",proposito:"Gestionar el ciclo de vida de una comunicación lógica de más alto nivel que una simple conexión de transporte.",problema:'Una conexión de transporte solo mueve bytes. Muchas aplicaciones necesitan además saber "esta petición pertenece a la misma conversación que la anterior", poder retomar una transferencia larga desde un punto intermedio o coordinar turnos.',porque:"El modelo OSI se diseñó en una época de terminales y transferencias largas por enlaces poco fiables, donde reiniciar una transferencia desde cero era carísimo.",sinElla:"Cada interrupción obligaría a empezar de nuevo, y no habría forma estándar de relacionar varias conexiones con una misma conversación. En la práctica, las aplicaciones modernas resuelven esto por su cuenta.",interaccion:'Usa las conexiones de la capa 4 (una o varias) y ofrece a las capas 6 y 7 un "diálogo" con identidad propia (un identificador de sesión).'},analogy:{title:"Una llamada con un centro de atención",text:["Llamas a soporte y te dan un número de caso. Si la llamada se corta (se cae la conexión), vuelves a llamar, das tu número de caso y continúas donde ibas, sin explicar todo otra vez. El número de caso es el identificador de sesión; cada llamada es una conexión.",'El agente también controla el diálogo: "primero hable usted, luego le respondo" (half-duplex) o una conversación libre (full-duplex). Y si te dicta una lista larga, cada cierto tiempo te pregunta "¿hasta aquí lo anotó?": eso son los puntos de control (checkpoints).'],mapping:[["Número de caso","Identificador de sesión"],["Cada llamada telefónica","Una conexión de transporte"],["Retomar el caso tras un corte","Reanudación de sesión"],['"¿Hasta aquí lo anotó?"',"Checkpoint / sincronización"],["Turnos para hablar","Control de diálogo"]]},technical:{recibe:"Datos de la capa 6 que pertenecen a un diálogo de aplicación.",procesa:"Apertura y cierre ordenado del diálogo, asignación de identificadores, control de turnos, inserción de puntos de sincronización y recuperación tras fallos.",produce:"Los mismos datos, asociados a un contexto de sesión.",envia:"Los datos a la capa 4, que puede usar una o varias conexiones.",agrega:'En el modelo OSI puro, información de control de sesión. En la pila TCP/IP real no hay un encabezado de "capa 5" separado: esa información va dentro de los protocolos de aplicación (cookies, IDs de sesión TLS, tokens) o en la propia capa de transporte.',comunica:"Conceptualmente con la capa 5 del otro extremo; en la práctica, con la lógica de sesión de la aplicación o protocolo remoto."},topics:[{id:"funciones",title:"Establecimiento, mantenimiento y terminación",level:"Beginner",body:['**Establecimiento**: las partes acuerdan iniciar un diálogo, se autentican si hace falta y negocian parámetros. **Mantenimiento**: se conserva el contexto, se envían mensajes de "sigo aquí" (keepalives) y se controla quién habla. **Terminación**: se cierra el diálogo de forma ordenada, liberando recursos, o se aborta.',"**Control de diálogo**: define si la comunicación es simplex (un solo sentido), half-duplex (por turnos) o full-duplex. **Sincronización**: se insertan puntos de control para que, si algo falla en el byte 900 000 de una transferencia, se retome desde el último checkpoint y no desde cero."]},{id:"stateful",title:"Comunicación stateful y stateless",level:"Intermediate",body:['**Stateful**: el servidor guarda el estado de cada cliente entre peticiones (por ejemplo, el carrito de compras en memoria, asociado a un ID de sesión). Es cómodo, pero dificulta escalar: si el siguiente request llega a otro servidor, este no conoce el estado (por eso existen las "sticky sessions" o los almacenes compartidos como Redis).',"**Stateless**: cada petición trae todo lo necesario para procesarla. HTTP es stateless por diseño: el servidor no recuerda la petición anterior. Las APIs REST suelen enviar un **token** (por ejemplo un JWT) en cada petición para identificar al usuario sin que el servidor guarde nada.","Ojo: TCP es **stateful** (cada extremo mantiene secuencias y ventanas) aunque HTTP, que va encima, sea **stateless**."]},{id:"tipos-sesion",title:"Conexión, sesión de red, sesión web, sesión de autenticación",level:"Intermediate",body:["Estos términos se mezclan constantemente; la tabla aclara la diferencia. Lo importante: **una sesión web puede durar días y usar cientos de conexiones TCP distintas**, y una sola conexión TCP (con HTTP/2) puede transportar peticiones de varias pestañas."],table:{head:["Concepto","Dónde vive","Qué la identifica","Duración típica"],rows:[["Conexión TCP","Capa 4, kernel","Tupla de 5 (IPs, puertos, protocolo)","Segundos a minutos"],['Sesión de red / "flujo"',"Firewalls, NAT, routers","La misma tupla, en sus tablas de estado","Hasta un timeout de inactividad"],["Sesión TLS","Entre capa 4 y 7","Claves negociadas; tickets o IDs de sesión para reanudar","Una conexión, reanudable"],["Sesión web","Aplicación (servidor)","Cookie de sesión (por ejemplo `sessionid=...`)","Minutos a días"],["Sesión de autenticación","Aplicación / proveedor de identidad","Token, cookie o ticket (Kerberos, OAuth, SSO)","Hasta que expira o cierras sesión"],["Sesión de aplicación","El propio programa","El estado interno (una llamada SIP, una sesión SSH)","Lo que dure la tarea"]]}},{id:"identificadores",title:"Identificadores de sesión y su seguridad",level:"Advanced",body:["Un **ID de sesión** es un valor aleatorio largo que el servidor entrega al iniciar sesión (normalmente en una cookie). Quien lo presente será tratado como ese usuario. Por eso debe ser impredecible, viajar solo por HTTPS (`Secure`), no ser accesible desde JavaScript (`HttpOnly`), limitarse al propio sitio (`SameSite`), regenerarse al iniciar sesión y caducar.","Ataques típicos: **secuestro de sesión** (robar la cookie, por ejemplo con XSS o en una red sin cifrado), **fijación de sesión** (obligar a la víctima a usar un ID conocido por el atacante; se evita regenerando el ID al hacer login)."],code:[{lang:"http",title:"Cookie de sesión bien configurada",content:`HTTP/1.1 200 OK
Set-Cookie: sessionid=k3J9x0pQ2vT8...; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=3600`}]},{id:"moderno",title:'Por qué la capa 5 es "conceptual" hoy',level:"Advanced",body:["La pila TCP/IP no tiene una capa de sesión separada: el modelo TCP/IP agrupa las capas 5, 6 y 7 en una sola capa de **aplicación**. Las funciones de sesión se repartieron así:"],bullets:["Apertura y cierre ordenados, y control full-duplex: **TCP** (handshake, FIN).","Reanudación tras desconexión: **TLS** (session tickets), **QUIC** (Connection ID que sobrevive a un cambio de IP).","Varios diálogos sobre una conexión: **HTTP/2** y **QUIC** (streams).","Contexto de usuario: cookies, tokens y almacenes de sesión de las **aplicaciones**.","Checkpoints: reanudación de descargas con **HTTP Range** (`Range: bytes=500000-`), y en protocolos de archivos como SMB.","Protocolos que se suelen citar como de capa 5: **NetBIOS Session Service** (TCP 139), **RPC**, la parte de control de **SIP** y **PPTP** (histórico). Su clasificación es didáctica y debatible."],note:'En una entrevista, decir "la capa 5 casi no existe como protocolo aparte; sus funciones las hacen TCP, TLS y la aplicación" demuestra criterio, siempre que expliques qué funciones son.'}],protocols:[{name:"NetBIOS Session Service",what:"Servicio de sesiones de las redes Windows antiguas.",how:"Establece sesiones sobre TCP 139 entre nombres NetBIOS.",use:"Compartición de archivos heredada; SMB moderno usa directamente TCP 445.",relation:'Ejemplo clásico de protocolo de "capa 5".',port:"TCP 139"},{name:"RPC (Remote Procedure Call)",what:"Mecanismo para llamar funciones en otro equipo como si fueran locales.",how:"Cliente y servidor mantienen un diálogo de peticiones y respuestas con identificadores.",use:"Servicios de Windows (MS-RPC), NFS (ONC RPC), gRPC moderno.",relation:"Clasificación variable entre capa 5 y 7."},{name:"SIP",what:"Protocolo de señalización para iniciar, modificar y terminar llamadas de VoIP.",how:"INVITE, 200 OK, ACK, BYE: establece la sesión; el audio va por RTP aparte.",use:"Telefonía IP.",relation:"Gestiona sesiones aunque suele clasificarse en capa 7.",port:"UDP/TCP 5060"},{name:"TLS (reanudación de sesión)",what:"Mecanismo para reutilizar una sesión TLS previa sin repetir el handshake completo.",how:"Session tickets o PSK en TLS 1.3.",use:"Reconexiones rápidas a sitios HTTPS.",relation:"Función de sesión dentro de un protocolo que se ubica didácticamente en capa 6."},{name:"SOCKS",what:"Protocolo de proxy genérico.",how:"El cliente pide al proxy abrir una conexión en su nombre.",use:"Proxies, Tor.",relation:"A veces citado en capa 5.",port:"TCP 1080"}],hardware:[{name:"Servidores de aplicación",desc:"Mantienen el estado de las sesiones web (en memoria, base de datos o Redis)."},{name:"Balanceadores de carga",desc:'Pueden aplicar "persistencia de sesión" para que un cliente siempre vaya al mismo servidor.'},{name:"Firewalls stateful",desc:'Llevan una tabla de "sesiones" (flujos) con timeout de inactividad.'},{name:"Proveedores de identidad",desc:"Emiten sesiones de autenticación y tokens: Active Directory/Kerberos, Okta, Entra ID."}],examples:[{title:"Iniciar sesión en un banco en línea",text:"Te autenticas; el servidor crea una sesión y te envía una cookie. Durante 10 minutos, cada clic abre o reutiliza conexiones TCP distintas, pero todas presentan la misma cookie. Si no haces nada, la sesión expira aunque tu Wi-Fi siga conectado."},{title:"Descarga reanudable",text:"Un archivo de 4 GB se corta al 70 %. El navegador pide `Range: bytes=2800000000-` y continúa: es la idea de checkpoint."},{title:"SSH",text:"Una sesión SSH es una conexión TCP con canales multiplexados dentro (shell, reenvío de puertos). Si cae la conexión, cae la sesión: herramientas como tmux o mosh existen para conservarla."}],security:[{name:"Secuestro de sesión (session hijacking)",how:"Robo de la cookie o token de sesión por XSS, malware o tráfico sin cifrar, y reutilización desde otro equipo.",detect:"La misma sesión desde IPs o dispositivos muy distintos, cambios bruscos de geolocalización.",defend:"HTTPS siempre, cookies `Secure` + `HttpOnly` + `SameSite`, expiración corta, vincular sesiones a contexto, cerrar sesión en el servidor."},{name:"Fijación de sesión",how:"El atacante consigue que la víctima inicie sesión con un ID que el atacante ya conoce.",detect:"IDs de sesión que no cambian tras el login.",defend:"Regenerar el ID de sesión al autenticar."},{name:"Repetición (replay) de tokens",how:"Reutilizar un token capturado antes de que expire.",detect:"Uso del mismo token desde orígenes distintos, `jti` repetidos.",defend:"Tokens de vida corta, rotación de refresh tokens, nonces."},{name:"Agotamiento de sesiones",how:"Crear sesiones masivamente para llenar la memoria del servidor o la tabla de estado de un firewall.",detect:"Crecimiento anómalo del número de sesiones.",defend:"Límites por IP, timeouts, no crear sesión antes de autenticar."}],troubleshooting:{symptoms:['Te "saca" de una aplicación cada pocos minutos.',"El login funciona pero la página siguiente vuelve a pedir credenciales.","Detrás de un balanceador, el usuario pierde el carrito al azar.","Conexiones largas (SSH, bases de datos) se cortan tras un tiempo de inactividad."],causes:["Cookie sin enviar: dominio o path incorrectos, `SameSite` estricto, bloqueo de cookies de terceros.","Reloj del equipo desfasado: tokens que parecen caducados.","Balanceo sin persistencia ni almacén de sesión compartido.","Timeout de inactividad en un firewall o NAT más corto que el de la aplicación."],tools:[{cmd:"DevTools → Application → Cookies",desc:"Ver si la cookie existe, su dominio, expiración y atributos."},{cmd:"DevTools → Network → encabezados Cookie / Set-Cookie",desc:"Ver si el navegador la envía en cada petición."},{cmd:"curl -v -c cookies.txt -b cookies.txt",desc:"Reproducir un flujo de login guardando y enviando cookies."},{cmd:"Logs del balanceador / firewall",desc:"Timeouts de sesión, a qué servidor fue cada petición."}],procedure:["Reproduce el problema y observa en DevTools si llega el `Set-Cookie` y si se reenvía en la siguiente petición.","Compara la hora del cliente y del servidor si hay tokens con expiración.","Revisa si las peticiones van a servidores distintos detrás del balanceador.","Para cortes por inactividad, configura keepalives (por ejemplo `ServerAliveInterval` en SSH) o ajusta el timeout del firewall."],interpret:["Cookie presente pero no enviada: atributos Domain/Path/SameSite.","Cortes exactos cada X minutos: un timeout de inactividad en algún equipo del camino.","Pérdida de sesión aleatoria con varios servidores: falta de estado compartido."],differentiate:'Si la conexión TCP y TLS se establecen sin problemas (lo ves en `curl -v`) pero la aplicación no "te recuerda", el problema es de sesión (capas 5 y 7), no de red. Si la conexión ni siquiera se establece, baja a la capa 4.'},quiz:[{q:"¿Cuál es la diferencia entre una conexión TCP y una sesión web?",options:["Son lo mismo","La conexión es de capa 4 y efímera; la sesión web es un contexto de aplicación que puede usar muchas conexiones","La sesión web es de capa 3","La conexión TCP dura más que la sesión"],answer:1,why:"Una sesión web (cookie) puede durar días y usar cientos de conexiones TCP distintas.",level:"Intermediate"},{q:"HTTP es...",options:["Stateful","Stateless: cada petición es independiente","Orientado a conexión por sí mismo","Un protocolo de capa 4"],answer:1,why:"HTTP no recuerda peticiones anteriores; el estado se añade con cookies o tokens.",level:"Beginner"},{q:"¿Qué función de sesión permite retomar una transferencia sin empezar de cero?",options:["Control de diálogo","Sincronización con puntos de control","Multiplexación","Enrutamiento"],answer:1,why:"Los checkpoints marcan hasta dónde se transfirió correctamente.",level:"Beginner"},{q:"¿Por qué se dice que la capa 5 es conceptual en redes modernas?",options:["Porque no tiene ninguna función","Porque sus funciones las implementan TCP, TLS, QUIC y las aplicaciones, sin un protocolo separado","Porque solo existe en IPv6","Porque la eliminó la ISO"],answer:1,why:"El modelo TCP/IP agrupa 5, 6 y 7 en la capa de aplicación.",level:"Advanced"},{q:"¿Qué atributo de cookie impide que JavaScript la lea, mitigando el robo por XSS?",options:["Secure","HttpOnly","Max-Age","Path"],answer:1,why:"HttpOnly la oculta de `document.cookie`. Secure obliga a enviarla solo por HTTPS.",level:"Advanced"},{q:"Una sesión SSH se cae exactamente tras 30 minutos sin actividad. ¿Sospecha principal?",options:["DNS","Timeout de inactividad en un firewall o NAT del camino","MTU","Cable dañado"],answer:1,why:"Los firewalls stateful olvidan los flujos inactivos. Solución: keepalives.",level:"Advanced"}],lab:{title:"Ve tu sesión web por dentro",where:"Tu navegador (DevTools)",goal:"Distinguir la sesión web (cookie) de las conexiones TCP que la transportan.",steps:["Abre un sitio donde tengas cuenta e inicia sesión. Abre DevTools (F12).","En Application (Chrome) o Storage (Firefox) → Cookies, localiza la cookie de sesión. Anota sus atributos: Secure, HttpOnly, SameSite, Expires.","En Network, recarga la página y abre cualquier petición. Busca el encabezado `Cookie:` en Request Headers.",'En Chrome, abre `chrome://net-internals/#sockets` y pulsa "Flush socket pools". Navega de nuevo: tu sesión sigue activa aunque se crearon conexiones TCP nuevas.',"Borra solo la cookie de sesión y recarga: verás que te pide iniciar sesión otra vez, aunque la red no cambió."],expected:"Comprobarás que cerrar todas las conexiones no cierra la sesión, y que borrar la cookie sí: la sesión vive en la aplicación, no en la red."}},t1={n:6,key:"presentacion",name:"Presentación",en:"Presentation",pdu:"Datos",color:"l6",hex:"#b48af0",tagline:"Traduce, codifica, comprime y cifra los datos para que ambos extremos los entiendan.",keyPoints:["Se ocupa de la representación de los datos, no de su transporte.","Codificar (Base64, UTF-8) es reversible y sin clave; cifrar (AES) es reversible con clave; hashear (SHA-256) no es reversible.","Se comprime antes de cifrar: los datos cifrados parecen aleatorios y no se comprimen.","TLS se enseña aquí, pero en la práctica vive entre la capa 4 y la 7; no encaja en una sola capa.","Formatos de serialización: JSON, XML, Protocol Buffers, ASN.1 (certificados X.509, SNMP)."],intro:{que:"La capa que se asegura de que los datos que envía una aplicación puedan ser entendidos por la aplicación del otro lado, sin importar el sistema, el idioma o la arquitectura de cada equipo.",proposito:"Traducir entre formatos (codificación de caracteres, serialización), comprimir para ahorrar ancho de banda y cifrar para proteger la confidencialidad.",problema:"Un equipo puede representar el texto en UTF-8 y otro en una codificación antigua; uno guarda números en big-endian y otro en little-endian; una estructura de datos en memoria no se puede enviar tal cual por un cable.",porque:"Las aplicaciones necesitan un formato común acordado, igual que dos personas necesitan un idioma común.",sinElla:'Verías caracteres rotos (el clásico "Ã±" en vez de "ñ"), números mal interpretados y datos sensibles viajando en claro.',interaccion:'Recibe los datos de la aplicación en su forma "interna" y los entrega a la capa 5 en un formato transmisible (serializado, quizá comprimido y cifrado). En el receptor hace lo inverso.'},analogy:{title:"El traductor y el sobre con candado",text:["Un empresario dominicano le escribe a un socio en Japón. Un traductor pasa la carta a un idioma que ambos entienden (codificación y formato), la resume en menos páginas sin perder contenido (compresión) y la mete en una caja con candado cuya llave solo tiene el socio (cifrado).","Del otro lado: se abre el candado, se expande el resumen y se traduce al idioma del socio. El contenido de la carta nunca cambió de significado; solo su representación."],mapping:[["El traductor","Codificación / serialización"],["El idioma común","UTF-8, JSON, XML, ASN.1"],["Resumir sin perder nada","Compresión sin pérdida (gzip, Brotli)"],["La caja con candado","Cifrado (TLS, AES)"],["La huella digital de la carta","Hash (SHA-256)"]]},technical:{recibe:"Estructuras de datos de la aplicación: texto, objetos, imágenes, números.",procesa:"Serialización (objeto → bytes), codificación de caracteres, conversión de orden de bytes, compresión y cifrado.",produce:"Una secuencia de bytes en un formato acordado, posiblemente comprimida y cifrada.",envia:"Esos bytes a la capa 5 para su diálogo y luego a la capa 4.",agrega:'No hay un encabezado de "capa 6" estándar en TCP/IP; la información de formato viaja en metadatos de los propios protocolos (por ejemplo `Content-Type: application/json; charset=utf-8`, `Content-Encoding: gzip`) o en registros TLS (5 bytes de encabezado por registro).',comunica:"Con la capa 6 del otro extremo, que debe conocer el mismo formato, algoritmo de compresión y claves de cifrado."},topics:[{id:"caracteres",title:"Codificación de caracteres: ASCII, Unicode, UTF-8",level:"Beginner",body:['**ASCII** asigna números de 7 bits (0–127) a letras inglesas, dígitos y símbolos: "A" = 65 = 0x41. No incluye ñ, tildes ni otros alfabetos.','**Unicode** es un catálogo que asigna un número (**code point**) a cada carácter de casi todos los idiomas y a los emojis: "ñ" = U+00F1, "€" = U+20AC. Unicode no dice cómo se guardan esos números en bytes; eso lo define una **codificación**.','**UTF-8** es la codificación dominante en Internet. Usa de 1 a 4 bytes por carácter y es compatible con ASCII: "A" sigue siendo 0x41 (1 byte), "ñ" es 0xC3 0xB1 (2 bytes), "€" es 0xE2 0x82 0xAC (3 bytes). Si un programa lee bytes UTF-8 creyendo que son Latin-1, "ñ" aparece como "Ã±": un error de capa 6.'],code:[{lang:"text",title:'La palabra "Año" en UTF-8',content:`Carácter:   A      ñ           o
Code point: U+0041 U+00F1      U+006F
Bytes:      41     C3 B1       6F      → 4 bytes para 3 caracteres`}]},{id:"serializacion",title:"Serialización: JSON, XML, ASN.1, Protobuf",level:"Intermediate",body:["**Serializar** es convertir una estructura en memoria (un objeto, una lista) en una secuencia de bytes que se pueda transmitir o guardar, y **deserializar** es el proceso inverso.","**JSON**: texto legible, ligero, el estándar de las APIs web. **XML**: texto con etiquetas, más verboso, con esquemas formales; se usa en SOAP, SAML y muchas configuraciones. **ASN.1**: notación formal para describir estructuras, con codificaciones binarias como **DER/BER**; la usan los certificados **X.509**, **SNMP**, LDAP y la telefonía móvil. **Protocol Buffers** (gRPC): binario, compacto y rápido, con un esquema `.proto`."],code:[{lang:"json",title:"JSON",content:`{
  "usuario": "melo",
  "capa": 6,
  "temas": ["UTF-8", "TLS", "gzip"]
}`},{lang:"text",title:"El mismo dato en XML",content:`<registro>
  <usuario>melo</usuario>
  <capa>6</capa>
  <temas><t>UTF-8</t><t>TLS</t><t>gzip</t></temas>
</registro>`}]},{id:"mime",title:"MIME y tipos de contenido",level:"Intermediate",body:["**MIME** nació para el correo electrónico: permitir adjuntos, imágenes y texto que no fuera ASCII. Define **tipos de contenido** (`text/html`, `application/json`, `image/png`) y cómo codificar binarios en texto, por ejemplo con **Base64**.","HTTP adoptó los tipos MIME en el encabezado `Content-Type`. El navegador decide cómo mostrar una respuesta según ese encabezado, no según la extensión del archivo."],code:[{lang:"http",title:"Indicaciones de capa 6 dentro de HTTP",content:`Content-Type: text/html; charset=utf-8
Content-Encoding: br
Content-Length: 18342`}]},{id:"tres-conceptos",title:"Encoding vs. encryption vs. hashing (y compresión)",level:"Beginner",body:['Confundir estos conceptos es uno de los errores más graves en entrevistas de seguridad. **Base64 no es cifrado**: cualquiera lo decodifica sin clave. Un hash no se "descifra": se compara.',"Al combinar compresión y cifrado se **comprime primero y se cifra después**. Un buen cifrado produce bytes que parecen aleatorios, y lo aleatorio no se puede comprimir. (Comprimir datos secretos mezclados con datos del atacante tiene riesgos: ataques como CRIME/BREACH; por eso TLS 1.3 eliminó la compresión a nivel TLS.)"],table:{head:["","Codificación","Compresión","Cifrado","Hash"],rows:[["Objetivo","Representar datos en otro formato","Reducir tamaño","Confidencialidad","Integridad / huella"],["¿Reversible?","Sí, sin clave","Sí, sin clave","Sí, solo con la clave","No"],["¿Usa clave?","No","No","Sí","No (HMAC sí)"],["Tamaño de salida","Similar o mayor","Menor","Similar","Fijo (256 bits en SHA-256)"],["Ejemplos","Base64, UTF-8, URL encoding","gzip, Brotli, zstd","AES-GCM, ChaCha20, RSA","SHA-256, SHA-3; bcrypt/Argon2 para contraseñas"]]}},{id:"cifrado",title:"Qué ocurre cuando los datos se cifran",level:"Intermediate",body:["**Cifrado simétrico** (AES, ChaCha20): la misma clave cifra y descifra. Es muy rápido y es el que protege el grueso de los datos. **Cifrado asimétrico** (RSA, curvas elípticas): un par de claves pública y privada. Es lento; se usa para intercambiar claves y para firmas digitales.","TLS combina ambos: en el handshake, cliente y servidor usan criptografía asimétrica (intercambio **ECDHE**) para acordar una clave secreta, y el servidor demuestra su identidad con un **certificado** X.509 firmado por una autoridad (CA). Después, todos los datos se cifran con un algoritmo simétrico **AEAD** (como AES-GCM), que además de cifrar **autentica**: si alguien modifica un byte, el receptor lo detecta.","Lo que un observador en la red sigue viendo con HTTPS: IPs, puertos, tamaños y tiempos de los paquetes, y normalmente el nombre del sitio en el **SNI** del ClientHello (salvo con ECH). Lo que ya no ve: la URL completa, los encabezados, las cookies y el contenido."]},{id:"tls-osi",title:"TLS y el modelo OSI: una relación incómoda",level:"Advanced",body:['Los cursos suelen poner TLS en la capa 6 porque cifra y "presenta" datos. Pero técnicamente TLS:'],bullets:["Corre **sobre TCP** (capa 4) y **debajo** de HTTP, SMTP, IMAP… (capa 7).","Tiene su propio handshake, estado y reanudación: funciones de **sesión** (capa 5).","En el modelo TCP/IP forma parte de la capa de **aplicación**; para el sistema operativo es una librería que usa la aplicación (OpenSSL, SChannel), no parte del kernel.","En QUIC, TLS 1.3 va **dentro** del protocolo de transporte."],note:'Respuesta de entrevista: "Didácticamente se ubica en la capa 6 por el cifrado, aunque en la práctica opera entre la capa 4 y la 7, y realiza también funciones de sesión."'}],protocols:[{name:"TLS 1.2 / 1.3",what:"Protocolo de seguridad que da confidencialidad, integridad y autenticación del servidor (y opcionalmente del cliente).",how:"Handshake con intercambio de claves y certificado; luego registros cifrados con AEAD.",use:"HTTPS, SMTPS, IMAPS, LDAPS, VPNs SSL, conexiones a bases de datos.",relation:"Entre la capa 4 y la 7; en QUIC está integrado en el transporte."},{name:"UTF-8 / Unicode",what:"Estándar de caracteres y su codificación dominante.",how:"1 a 4 bytes por code point, compatible con ASCII.",use:"Casi toda la web, JSON, sistemas modernos.",relation:"Se declara en capa 7 (`charset=utf-8`)."},{name:"MIME",what:"Tipos de contenido y codificaciones para mensajes.",how:"`Content-Type`, mensajes multiparte, Base64 y quoted-printable.",use:"Correo con adjuntos, HTTP.",relation:"Usado por SMTP y HTTP."},{name:"ASN.1 (DER/BER)",what:"Lenguaje para describir estructuras de datos y sus codificaciones binarias.",how:"Etiqueta-longitud-valor (TLV).",use:"Certificados X.509, SNMP, LDAP, Kerberos.",relation:"Clásico ejemplo de capa 6 en la teoría OSI."},{name:"gzip / Brotli / zstd",what:"Algoritmos de compresión sin pérdida.",how:"Buscan repeticiones y las sustituyen por referencias más cortas.",use:"`Content-Encoding` en HTTP, archivos.",relation:"Negociados en capa 7 con `Accept-Encoding`."},{name:"JPEG, PNG, MP3, H.264",what:"Formatos de imagen, audio y video.",how:"Compresión con o sin pérdida y estructuras de archivo definidas.",use:"Multimedia.",relation:"Representación de datos: ejemplos clásicos de capa 6."}],hardware:[{name:"Librerías criptográficas",desc:"OpenSSL, BoringSSL, SChannel (Windows), Secure Transport/Network.framework (Apple)."},{name:"Aceleradores y HSM",desc:"Hardware que acelera el cifrado o guarda claves privadas de forma segura."},{name:"CPU con AES-NI",desc:"Instrucciones que hacen el cifrado AES casi gratuito en rendimiento."},{name:"Proxies y balanceadores con terminación TLS",desc:"Descifran el tráfico en el borde (Nginx, HAProxy, Cloudflare) y lo reenvían al servidor."},{name:"Librerías de serialización y compresión",desc:"Parsers de JSON/XML, zlib, códecs multimedia."}],examples:[{title:"Una API REST",text:"La aplicación serializa un objeto a JSON en UTF-8, lo comprime con gzip y TLS lo cifra. El servidor descifra, descomprime y deserializa."},{title:"Un correo con foto adjunta",text:"MIME divide el mensaje en partes; la foto (binaria) se codifica en Base64 para viajar como texto por SMTP."},{title:"Caracteres rotos",text:'Una base de datos en Latin-1 recibe texto UTF-8: los nombres con tilde aparecen como "Ã©". El problema no es de red, es de representación.'}],security:[{name:"Confundir codificación con cifrado",how:'Guardar o enviar contraseñas "protegidas" con Base64; cualquier atacante las decodifica.',detect:"Revisión de código y de tráfico: cadenas Base64 en encabezados como `Authorization: Basic` sobre HTTP sin TLS.",defend:"Usar TLS para el transporte y hashes lentos con sal (bcrypt, Argon2) para guardar contraseñas."},{name:"Configuraciones TLS débiles",how:"Versiones antiguas (SSL 3.0, TLS 1.0/1.1), cifrados débiles, certificados caducados o autofirmados aceptados sin validar.",detect:"`openssl s_client`, `nmap --script ssl-enum-ciphers`, escáneres como SSL Labs.",defend:"Solo TLS 1.2 y 1.3, cifrados AEAD, HSTS, renovación automática de certificados."},{name:"Man-in-the-middle sobre TLS",how:"Presentar un certificado falso; funciona si el usuario acepta la advertencia o si hay una CA maliciosa instalada en el equipo.",detect:"Emisor de certificado inesperado, Certificate Transparency.",defend:"Validar certificados siempre, HSTS, certificate pinning en apps móviles, controlar las CA instaladas."},{name:"Deserialización insegura",how:"Una aplicación deserializa datos no confiables en un formato que permite crear objetos arbitrarios y termina ejecutando código.",detect:"Payloads serializados extraños, errores de deserialización en logs.",defend:"No deserializar datos no confiables con formatos nativos; usar JSON con validación de esquema."},{name:"Ataques por compresión",how:"CRIME y BREACH: comparar el tamaño comprimido de respuestas para adivinar secretos.",detect:"Peticiones repetidas con pequeñas variaciones.",defend:"Sin compresión en TLS (TLS 1.3), no mezclar secretos con datos del usuario en respuestas comprimidas."}],troubleshooting:{symptoms:['Caracteres extraños: "Ã±", "â‚¬", rombos con signo de interrogación.','Error "certificate has expired" o "NET::ERR_CERT_AUTHORITY_INVALID".','Error de handshake TLS: "no shared cipher" o "protocol version".',"La API devuelve 415 Unsupported Media Type o el cliente no logra parsear JSON.","Archivos descargados que no abren (compresión mal declarada)."],causes:["Codificaciones distintas entre cliente, servidor y base de datos.","Certificado caducado, sin la cadena intermedia o con otro nombre.","Cliente antiguo sin TLS 1.2, o servidor que solo acepta TLS 1.3.","Encabezado `Content-Type` o `Content-Encoding` incorrecto.",'Reloj del sistema desfasado (el certificado parece "no válido todavía" o caducado).'],tools:[{cmd:"openssl s_client -connect host:443 -servername host",desc:"Ver la versión TLS negociada, el cifrado y la cadena de certificados."},{cmd:"curl -v https://host",desc:"Muestra el handshake TLS y los errores de verificación."},{cmd:"DevTools → Security / ícono del candado",desc:"Detalles del certificado y de la conexión."},{cmd:"file, iconv, hexdump -C",desc:"Identificar y convertir codificaciones; ver los bytes reales."},{cmd:"Wireshark: filtro `tls.handshake`",desc:"Ver ClientHello, ServerHello, versiones y SNI."}],procedure:["Si hay caracteres rotos, mira los bytes reales (hexdump) y compáralos con la codificación declarada.","Ante errores TLS, revisa fecha y hora del equipo, luego el certificado (validez, nombre, cadena).","Compara versiones TLS y cifrados soportados por cliente y servidor.","Verifica `Content-Type` y `Content-Encoding` de la respuesta."],interpret:['"Ã±" en lugar de "ñ": bytes UTF-8 interpretados como Latin-1.',"`Verify return code: 10 (certificate has expired)`: certificado caducado.","`unable to get local issuer certificate`: falta la cadena intermedia o la CA no es de confianza.","`handshake failure` / `protocol version`: no hay versión o cifrado en común."],differentiate:'Si la conexión TCP se establece (el puerto responde) y falla el handshake TLS, el problema está en la "capa 6" (certificados, versiones). Si TLS se establece y el error es HTTP 4xx o 5xx, es capa 7.'},quiz:[{q:"Base64 es...",options:["Un algoritmo de cifrado","Una codificación reversible sin clave","Un hash","Un algoritmo de compresión"],answer:1,why:"Cualquiera puede decodificar Base64. No aporta confidencialidad.",level:"Beginner"},{q:"¿Qué diferencia a un hash de un cifrado?",options:["El hash es reversible con clave","El hash no es reversible y produce una salida de tamaño fijo","El cifrado no usa clave","Son lo mismo"],answer:1,why:'Un hash sirve para verificar integridad o comparar contraseñas; no se "descifra".',level:"Beginner"},{q:"¿En qué orden se aplican compresión y cifrado?",options:["Cifrar y luego comprimir","Comprimir y luego cifrar","Da igual","Nunca se combinan"],answer:1,why:"Los datos cifrados parecen aleatorios y no se pueden comprimir.",level:"Intermediate"},{q:'Un sitio muestra "Ã±" donde debería decir "ñ". ¿Qué problema es?',options:["Pérdida de paquetes","Codificación de caracteres (UTF-8 leído como Latin-1)","Un puerto cerrado","Un loop de STP"],answer:1,why:"Es un problema de representación de datos: capa 6.",level:"Intermediate"},{q:"¿Dónde encaja TLS realmente?",options:["Exclusivamente en la capa 6","Entre la capa 4 y la 7: corre sobre TCP, debajo de la aplicación, y tiene funciones de sesión","En la capa 3","En la capa 2"],answer:1,why:"Se enseña en la 6 por el cifrado, pero no encaja limpiamente en una sola capa.",level:"Advanced"},{q:"Con HTTPS, ¿qué puede seguir viendo un observador de la red?",options:["La URL completa y las cookies","IPs, puertos, tamaños y, normalmente, el nombre del sitio en el SNI","El contenido de la página","Nada en absoluto"],answer:1,why:"TLS protege el contenido y los encabezados HTTP, no los metadatos de red. ECH puede ocultar el SNI.",level:"Advanced"},{q:"¿Qué formato usan los certificados X.509?",options:["JSON","ASN.1 codificado en DER","XML","CSV"],answer:1,why:"Los certificados se describen en ASN.1 y se codifican en DER (PEM es ese DER en Base64).",level:"Expert"}],lab:{title:"Codifica, hashea y cifra con tus propias manos",where:"Esta plataforma + terminal",goal:"Ver la diferencia real entre codificación, hash y cifrado, e inspeccionar un handshake TLS.",steps:["Usa el laboratorio interactivo de esta página: escribe un texto y compara sus bytes UTF-8, su Base64 y su SHA-256.","Cambia una sola letra y observa: el Base64 cambia un poco, el SHA-256 cambia por completo (efecto avalancha).",'En una terminal: `echo -n "hola" | base64` y luego `echo "aG9sYQ==" | base64 -d`.','Hash: `echo -n "hola" | sha256sum` (Linux) o `Get-FileHash` en PowerShell para un archivo.',"TLS: `openssl s_client -connect google.com:443 -servername google.com` y busca `Protocol`, `Cipher` y la cadena de certificados.","Comprime un archivo de texto con `gzip -k archivo.txt` y compara tamaños; luego intenta comprimir el resultado otra vez."],expected:"Base64 se revierte sin clave, el hash no se puede revertir, y comprimir algo ya comprimido (o cifrado) casi no reduce su tamaño."}},o1={n:7,key:"aplicacion",name:"Aplicación",en:"Application",pdu:"Datos",color:"l7",hex:"#ec6fa8",tagline:"Los protocolos que usan las aplicaciones para ofrecer servicios de red: web, DNS, correo, acceso remoto.",keyPoints:['La capa 7 no es "el programa" (Chrome); es el protocolo que el programa habla (HTTP, DNS, SMTP).',"Modelo cliente-servidor: el cliente inicia la petición; el servidor escucha en un puerto conocido.","HTTP: método + ruta + encabezados + cuerpo; la respuesta trae un código de estado (2xx, 3xx, 4xx, 5xx).",'DNS traduce nombres a IPs; "funciona por IP pero no por nombre" casi siempre es DNS.',"DHCP es un protocolo de capa 7 (sobre UDP 67/68) que configura parámetros de capa 3."],intro:{que:"La capa más cercana al usuario: define los protocolos con los que las aplicaciones piden y ofrecen servicios a través de la red.",proposito:'Dar a las aplicaciones un "idioma" estándar para tareas concretas: obtener una página, resolver un nombre, enviar un correo, iniciar sesión en un servidor remoto.',problema:'Las capas inferiores mueven bytes de forma genérica, pero no saben qué significa "dame la página principal" o "¿cuál es la IP de google.com?". Sin protocolos comunes, cada navegador necesitaría un acuerdo privado con cada servidor.',porque:"Gracias a HTTP, cualquier navegador habla con cualquier servidor web; gracias a SMTP, Gmail entrega correo a Outlook.",sinElla:"La red funcionaría pero no serviría para nada útil: habría transporte sin servicios.",interaccion:"Entrega los mensajes del protocolo (texto en HTTP/1.1, binario en HTTP/2 o DNS) a la capa 6 o directamente a TLS, y abre sockets TCP o UDP hacia el puerto del servicio."},analogy:{title:"El menú y el camarero de un restaurante",text:['En un restaurante no entras a la cocina: pides con un formato estándar ("Mesa 4: dos mofongos, uno sin cebolla"). El camarero lleva el pedido, y la cocina responde con el plato o con un "se nos acabó" (un código de estado).',"El menú es el protocolo: define qué se puede pedir y cómo. Tú eres el cliente, la cocina es el servidor, y el formato del pedido (método, plato, notas) es la petición HTTP con su método, su ruta y sus encabezados."],mapping:[["El menú","El protocolo (HTTP, DNS, SMTP)"],["El cliente que pide","El cliente (navegador, app)"],["La cocina","El servidor"],['"Dos mofongos sin cebolla"',"Método + ruta + encabezados"],['"Aquí tiene" / "Se acabó"',"Códigos de estado 200 / 404"],["El número de mesa","La cookie de sesión"]]},technical:{recibe:'Las acciones del usuario o del programa: "abrir esta URL", "enviar este correo".',procesa:"Construye los mensajes del protocolo, gestiona autenticación, cookies y caché, interpreta las respuestas.",produce:"Mensajes de aplicación: peticiones y respuestas HTTP, consultas DNS, comandos SMTP.",envia:"Los mensajes a la capa inferior, normalmente mediante la API de sockets hacia un puerto (80, 443, 53…).",agrega:"Los encabezados del propio protocolo: líneas de petición y encabezados HTTP, el encabezado DNS de 12 bytes, comandos SMTP.",comunica:"Con el proceso servidor del otro extremo, que escucha en un puerto conocido."},topics:[{id:"no-apps",title:'Qué significa realmente "capa de aplicación"',level:"Beginner",body:["Chrome, Outlook o WhatsApp **no** son la capa 7. Son programas que **usan** protocolos de capa 7. Chrome habla HTTP y DNS; Outlook habla SMTP, IMAP o protocolos de Exchange. Un mismo protocolo lo usan muchos programas: `curl`, Postman y Chrome hablan el mismo HTTP.","En el modelo **cliente-servidor**, el servidor ejecuta un proceso que escucha en un puerto conocido y el cliente inicia la comunicación desde un puerto efímero. En **peer-to-peer** (BitTorrent) cada nodo actúa como cliente y servidor.","Una **API** (interfaz de programación) es un contrato para que un programa use los servicios de otro. Una **API web** expone ese contrato por HTTP: rutas, métodos y formatos (normalmente JSON)."]},{id:"http",title:"HTTP: peticiones, respuestas, encabezados y cuerpo",level:"Beginner",body:["Una **petición** HTTP tiene: una línea con **método**, **ruta** y versión; **encabezados** (pares nombre: valor); una línea en blanco; y un **cuerpo** (payload) opcional. La **respuesta** tiene: una línea de estado con versión, **código** y frase; encabezados; línea en blanco; y cuerpo.","El encabezado `Host` es obligatorio en HTTP/1.1: permite que un mismo servidor (una IP) aloje muchos sitios. HTTP/2 y HTTP/3 mantienen la misma semántica (métodos, encabezados, códigos) pero la transmiten en binario y multiplexada."],code:[{lang:"http",title:"Petición",content:`GET /cursos/osi?nivel=1 HTTP/1.1
Host: academia.ejemplo.com
User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
Accept: text/html,application/json
Accept-Encoding: gzip, br
Cookie: sessionid=k3J9x0pQ2vT8
Connection: keep-alive`},{lang:"http",title:"Respuesta",content:`HTTP/1.1 200 OK
Date: Mon, 23 Nov 2026 21:14:02 GMT
Content-Type: application/json; charset=utf-8
Content-Encoding: br
Cache-Control: private, max-age=60
Strict-Transport-Security: max-age=31536000
Content-Length: 312

{"curso":"OSI","capa":1,"modulos":12}`}]},{id:"metodos",title:"Métodos y códigos de estado",level:"Beginner",body:["Un método es **seguro** si no modifica nada (GET, HEAD, OPTIONS) e **idempotente** si repetirlo produce el mismo resultado (GET, PUT, DELETE sí; POST no)."],table:{head:["Método","Uso","Cuerpo en la petición"],rows:[["GET","Obtener un recurso","No"],["POST","Crear o enviar datos (formularios, login)","Sí"],["PUT","Reemplazar un recurso completo","Sí"],["PATCH","Modificar parte de un recurso","Sí"],["DELETE","Borrar un recurso","Normalmente no"],["HEAD","Como GET pero solo encabezados","No"],["OPTIONS","Qué métodos acepta (preflight de CORS)","No"]]},code:[{lang:"text",title:"Familias de códigos de estado",content:`1xx  Informativo   101 Switching Protocols (WebSockets)
2xx  Éxito         200 OK · 201 Created · 204 No Content
3xx  Redirección   301 Moved Permanently · 302 Found · 304 Not Modified
4xx  Error cliente 400 Bad Request · 401 Unauthorized (sin autenticar)
                   403 Forbidden (autenticado, sin permiso) · 404 Not Found
                   429 Too Many Requests
5xx  Error servidor 500 Internal Server Error · 502 Bad Gateway
                   503 Service Unavailable · 504 Gateway Timeout`}],note:'401 vs 403: 401 = "no sé quién eres"; 403 = "sé quién eres y no tienes permiso". 502/504 suelen venir de un proxy o balanceador que no obtuvo respuesta válida del servidor de detrás.'},{id:"cookies-auth",title:"Cookies, sesiones y autenticación",level:"Intermediate",body:["HTTP no tiene memoria. Para recordar al usuario, el servidor envía `Set-Cookie` y el navegador la devuelve en cada petición con `Cookie`. Así se implementan sesiones, carritos y preferencias.",'Formas comunes de autenticación: **cookie de sesión** tras un formulario de login; **Basic** (`Authorization: Basic base64(usuario:clave)`, solo aceptable sobre HTTPS); **Bearer token** (`Authorization: Bearer eyJ...`, típico en APIs, a menudo un JWT); **OAuth 2.0 / OpenID Connect** ("Iniciar sesión con Google"), que delegan la autenticación en un proveedor.']},{id:"rest",title:"APIs REST",level:"Intermediate",body:["REST es un estilo de diseño: los **recursos** se identifican con URLs (`/usuarios/42`) y se manipulan con los métodos HTTP. Es **stateless**: cada petición trae la autenticación y todo lo necesario. Las respuestas usan códigos de estado y normalmente JSON."],code:[{lang:"bash",title:"Consumir una API REST con curl",content:`# Listar
curl -s https://api.ejemplo.com/v1/tickets -H "Authorization: Bearer $TOKEN"

# Crear
curl -s -X POST https://api.ejemplo.com/v1/tickets \\
  -H "Authorization: Bearer $TOKEN" \\
  -H "Content-Type: application/json" \\
  -d '{"titulo":"Sin internet en piso 3","prioridad":"alta"}'

# Respuesta esperada: HTTP/1.1 201 Created + JSON con el id`}]},{id:"navegador",title:"Cómo un navegador solicita una página web",level:"Beginner",body:["1) Interpreta la URL (esquema `https`, host, ruta). 2) Busca la IP del host: caché del navegador, del sistema, archivo `hosts` y, si hace falta, consulta **DNS**. 3) Abre una conexión **TCP** al puerto 443 (o QUIC por UDP 443). 4) Hace el handshake **TLS** y verifica el certificado. 5) Envía la petición **HTTP** GET. 6) Recibe la respuesta HTML, la analiza y descubre más recursos (CSS, JS, imágenes), que pide reutilizando conexiones. 7) Renderiza la página.",'Puedes ver todo esto en DevTools → Network → columna "Waterfall": tiempos de DNS, conexión, TLS, espera del servidor (TTFB) y descarga.']},{id:"dns",title:"DNS",level:"Beginner",body:["DNS traduce nombres (`www.google.com`) a direcciones IP. El equipo pregunta a un **resolver recursivo** (el de tu ISP, 8.8.8.8 o 1.1.1.1). Si este no tiene la respuesta en caché, pregunta a los servidores **raíz**, que lo envían a los del **TLD** (`.com`), que lo envían a los **autoritativos** del dominio, que dan la respuesta final. Cada respuesta tiene un **TTL** que indica cuánto tiempo puede guardarse en caché.","Registros principales: **A** (IPv4), **AAAA** (IPv6), **CNAME** (alias a otro nombre), **MX** (servidores de correo), **NS** (servidores autoritativos), **TXT** (texto: SPF, DKIM, verificaciones), **PTR** (resolución inversa IP → nombre), **SOA** (datos de la zona).","Usa UDP 53 normalmente y TCP 53 para respuestas grandes o transferencias de zona. Existen versiones cifradas: **DoT** (DNS over TLS, TCP 853) y **DoH** (DNS over HTTPS, 443)."],code:[{lang:"bash",title:"Consultas DNS",content:`$ dig +short A example.com
93.184.215.14

$ dig MX gmail.com +short
5 gmail-smtp-in.l.google.com.

$ nslookup -type=AAAA google.com 1.1.1.1

# Ver toda la cadena de delegación
$ dig +trace example.com`}]},{id:"dhcp",title:"DHCP y su clasificación",level:"Intermediate",body:["DHCP asigna automáticamente IP, máscara, gateway, DNS y duración del préstamo (lease). Proceso **DORA**: **D**iscover (el cliente, sin IP, envía un broadcast desde 0.0.0.0 a 255.255.255.255), **O**ffer (el servidor ofrece una IP), **R**equest (el cliente la pide formalmente), **A**ck (el servidor confirma).","Viaja sobre **UDP 67** (servidor) y **68** (cliente). Si el servidor está en otra subred, el router actúa como **relay** (`ip helper-address` en Cisco), porque los broadcasts no cruzan routers."],note:'Clasificación: DHCP es un protocolo de capa 7 (es una aplicación sobre UDP), aunque su función es configurar la capa 3. Por eso algunos lo asocian con la capa 3; la respuesta precisa es "capa 7 que configura parámetros de capa 3".'},{id:"otros",title:"Correo, acceso remoto, gestión y tiempo",level:"Intermediate",body:["El correo usa protocolos distintos para enviar y para leer: **SMTP** entrega correo entre servidores (TCP 25) y lo recibe de los clientes en el puerto de envío 587 con autenticación; **IMAP** (143, o 993 con TLS) permite leer el buzón dejándolo en el servidor y sincronizar varios dispositivos; **POP3** (110/995) lo descarga, histórico.","**SSH** (TCP 22) da acceso remoto cifrado a una shell, transferencia de archivos (SCP, SFTP) y túneles. **Telnet** (TCP 23) hace lo mismo **sin cifrar**: contraseñas visibles en la red; hoy solo para pruebas de conectividad o equipos antiguos. **FTP** (21 control, 20 o puertos pasivos para datos) transfiere archivos sin cifrar; se reemplaza por SFTP o FTPS.",'**SNMP** (UDP 161, traps en 162) monitorea y gestiona dispositivos de red; v1 y v2c usan "community strings" en texto claro, v3 añade autenticación y cifrado. **NTP** (UDP 123) sincroniza relojes: crítico para logs, certificados y Kerberos. **WebSockets** comienzan como HTTP con `Upgrade: websocket` (respuesta 101) y luego mantienen un canal bidireccional para chats y datos en tiempo real.']},{id:"herramientas7",title:"curl, DevTools, Postman y Wireshark",level:"Intermediate",body:["**curl** hace peticiones desde la terminal: `-v` muestra conexión, TLS y encabezados; `-I` solo encabezados; `-X` método; `-H` encabezado; `-d` cuerpo; `-L` sigue redirecciones. **DevTools** (F12) muestra cada petición del navegador, sus tiempos, encabezados y cookies. **Postman** es un cliente gráfico para probar y documentar APIs (colecciones, variables, tokens). **Wireshark** captura el tráfico real: filtra con `http`, `dns` o `tls`; el contenido HTTPS aparece cifrado salvo que exportes las claves del navegador (`SSLKEYLOGFILE`) en tu propio equipo."],code:[{lang:"bash",title:"curl en modo diagnóstico",content:`$ curl -v https://example.com -o /dev/null
*   Trying 93.184.215.14:443...
* Connected to example.com (93.184.215.14) port 443
* SSL connection using TLSv1.3 / TLS_AES_256_GCM_SHA384
* Server certificate: subject: CN=www.example.org
> GET / HTTP/2
> Host: example.com
> User-Agent: curl/8.5.0
< HTTP/2 200
< content-type: text/html`}]}],protocols:[{name:"HTTP / HTTPS",what:"Protocolo de la web. HTTPS = HTTP dentro de TLS.",how:"Peticiones con método, ruta y encabezados; respuestas con código de estado.",use:"Web, APIs REST, descargas.",relation:"HTTP/1.1 y 2 sobre TCP; HTTP/3 sobre QUIC (UDP).",port:"80 · 443"},{name:"DNS",what:"Sistema de nombres de dominio.",how:"Consultas recursivas e iterativas, caché con TTL.",use:"Traducir nombres a IPs, correo (MX), verificaciones (TXT).",relation:"UDP 53, TCP 53 para respuestas grandes; DoH/DoT cifrados.",port:"53"},{name:"DHCP",what:"Configuración automática de red.",how:"DORA por broadcast; préstamos con tiempo de vida.",use:"Casi toda red con equipos de usuario.",relation:"Capa 7 sobre UDP que configura la capa 3.",port:"UDP 67/68"},{name:"SMTP",what:"Transferencia de correo.",how:"Comandos de texto (EHLO, MAIL FROM, RCPT TO, DATA).",use:"Envío entre servidores y desde clientes.",relation:"Sobre TCP; STARTTLS para cifrar.",port:"25 · 587"},{name:"IMAP",what:"Acceso al buzón en el servidor.",how:"Carpetas, banderas y sincronización.",use:"Leer correo desde varios dispositivos.",relation:"Sobre TCP, con TLS en el 993.",port:"143 · 993"},{name:"SSH",what:"Acceso remoto seguro.",how:"Intercambio de claves, autenticación por contraseña o clave pública, canales cifrados.",use:"Administración de servidores y equipos de red, SFTP, túneles.",relation:"Sobre TCP; incluye su propio cifrado (no usa TLS).",port:"TCP 22"},{name:"Telnet",what:"Terminal remota sin cifrar.",how:"Envía todo en texto claro.",use:"Equipos heredados, probar si un puerto TCP está abierto.",relation:"Sobre TCP.",port:"TCP 23"},{name:"FTP",what:"Transferencia de archivos.",how:"Conexión de control y conexiones de datos separadas (modo activo o pasivo).",use:"Sistemas heredados; reemplazado por SFTP/FTPS.",relation:"Sobre TCP, sin cifrado.",port:"TCP 20/21"},{name:"SNMP",what:"Gestión y monitoreo de dispositivos.",how:"GET/SET sobre una base de información (MIB) y traps de alerta.",use:"Monitorear tráfico, CPU y estado de switches y routers.",relation:"Sobre UDP; mensajes codificados en ASN.1.",port:"UDP 161/162"},{name:"NTP",what:"Sincronización de relojes.",how:"Jerarquía de servidores (stratum) y cálculo del desfase.",use:"Logs coherentes, validez de certificados, Kerberos.",relation:"Sobre UDP.",port:"UDP 123"},{name:"WebSockets",what:"Canal bidireccional persistente.",how:'Empieza como HTTP con Upgrade y luego intercambia "frames" propios.',use:"Chats, paneles en tiempo real, juegos en navegador.",relation:"Sobre TCP (ws:// o wss:// con TLS).",port:"80 · 443"},{name:"LDAP · RDP · SMB",what:"Directorio, escritorio remoto y archivos compartidos.",how:"Protocolos de aplicación específicos.",use:"Active Directory, soporte remoto, carpetas de red.",relation:"Sobre TCP (y UDP en algunos casos).",port:"389 · 3389 · 445"}],hardware:[{name:"Servidores",desc:"Servidores web (Nginx, Apache, IIS), DNS (BIND, Windows DNS), correo (Postfix, Exchange), DHCP."},{name:"Clientes",desc:"Navegadores, clientes de correo, `curl`, Postman, apps móviles."},{name:"Proxy inverso y balanceador L7",desc:"Reparten tráfico mirando el contenido HTTP (ruta, encabezados) y suelen terminar TLS."},{name:"WAF",desc:"Firewall de aplicaciones web: inspecciona peticiones HTTP buscando ataques."},{name:"Firewall de nueva generación (NGFW)",desc:"Identifica aplicaciones (no solo puertos) y aplica políticas de capa 7."}],examples:[{title:"Abrir YouTube",text:"DNS resuelve `www.youtube.com`, el navegador abre QUIC o TCP+TLS al 443, pide la página por HTTP y luego descarga el video en fragmentos con más peticiones HTTP."},{title:"Enviar un correo desde Outlook",text:"El cliente envía por SMTP (587, autenticado) a su servidor; este busca el registro MX del dominio destino por DNS y entrega por SMTP (25) al servidor del destinatario; el destinatario lo lee por IMAP."},{title:"Soporte técnico remoto",text:"Un técnico entra por SSH a un servidor Linux o por RDP a un equipo Windows. Para un switch Cisco se usa SSH; Telnet solo en laboratorios."}],security:[{name:"Ataques a aplicaciones web",how:"Inyección SQL, XSS, CSRF, control de acceso roto (IDOR: cambiar `/facturas/41` por `/facturas/42`), subida de archivos peligrosos. Son la categoría principal del OWASP Top 10.",detect:"Logs del servidor y del WAF con patrones como `' OR 1=1`, `<script>`, accesos a IDs ajenos.",defend:"Consultas parametrizadas, escape de salida, tokens anti-CSRF, autorización en cada petición, WAF."},{name:"Phishing visto desde los protocolos",how:"El correo falso abusa de SMTP: el remitente visible (`From:`) se puede falsificar si el dominio no publica políticas. Los enlaces llevan a dominios parecidos (typosquatting) con certificados válidos.",detect:"Encabezados del correo: resultados de SPF, DKIM y DMARC; dominios recién registrados.",defend:"Publicar SPF, DKIM y DMARC con política `reject`; filtros de correo; formación del usuario; MFA resistente a phishing."},{name:"Ataques a DNS",how:"Envenenamiento de caché, secuestro de dominio, DNS tunneling (sacar datos codificados en subdominios), amplificación DDoS con resolvers abiertos.",detect:"Consultas a subdominios larguísimos y aleatorios, volumen anómalo de TXT, respuestas que cambian sin motivo.",defend:"DNSSEC, resolvers no abiertos, monitoreo de DNS, bloqueo de dominios maliciosos, bloqueo del registro (registry lock)."},{name:"Seguridad HTTP y configuraciones erróneas",how:"Paneles de administración expuestos, listado de directorios, credenciales por defecto, mensajes de error con trazas, CORS demasiado permisivo, falta de HSTS.",detect:"Escaneos autorizados (Nikto, ZAP), revisión de encabezados de seguridad.",defend:"HSTS, Content-Security-Policy, X-Content-Type-Options, cookies seguras, deshabilitar lo que no se use."},{name:"Seguridad de APIs",how:"Autorización por objeto rota (BOLA), exposición excesiva de datos, falta de límites de tasa, tokens filtrados.",detect:"Patrones de enumeración de IDs, picos de peticiones por token.",defend:"Autorización por objeto, validación de esquema, rate limiting, rotación de tokens, OWASP API Top 10."},{name:"Reconocimiento de servicios",how:"Identificar versiones de software por banners y encabezados (`Server: Apache/2.4.41`), enumerar subdominios por DNS y Certificate Transparency. Siempre con autorización.",detect:"Peticiones a rutas inexistentes en masa, user agents de escáneres.",defend:"Ocultar versiones, inventario de exposición, parchear lo expuesto."}],troubleshooting:{symptoms:['"No se puede encontrar la dirección DNS del servidor" (DNS_PROBE_FINISHED_NXDOMAIN).',"Funciona por IP pero no por nombre.","El sitio responde con 404, 500, 502, 503.","La página carga, pero el login falla o te devuelve 401/403.","El correo no llega o llega a spam.","Un dispositivo no obtiene IP (falla DHCP)."],causes:["DNS mal configurado en el equipo, servidor DNS caído o registro inexistente.","Caché DNS con un valor viejo.","Servicio web detenido o mal desplegado; proxy que no llega al backend.","Cookies o tokens caducados; permisos insuficientes.","Falta de SPF/DKIM/DMARC; IP en listas negras.","Servidor DHCP sin direcciones libres o sin relay hacia otra subred."],tools:[{cmd:"nslookup / dig / Resolve-DnsName",desc:"¿Resuelve el nombre? ¿Con qué servidor? ¿Qué TTL tiene?"},{cmd:"ipconfig /flushdns · ipconfig /displaydns",desc:"Borrar o ver la caché DNS del equipo."},{cmd:"curl -v / curl -I",desc:"Ver el código de estado, los encabezados y las redirecciones."},{cmd:"DevTools → Network",desc:"Peticiones fallidas, códigos, tiempos (DNS, conexión, TLS, TTFB)."},{cmd:"Logs del servidor (access.log, error.log)",desc:"Qué recibió el servidor y por qué falló."},{cmd:"ipconfig /release · /renew",desc:"Repetir el proceso DHCP."}],procedure:["Prueba por IP y por nombre. Si por IP funciona y por nombre no, es DNS.","Comprueba qué servidor DNS usa el equipo y prueba con otro (`nslookup dominio 1.1.1.1`).","Si resuelve, prueba el puerto (capa 4) y luego la respuesta HTTP con `curl -v`.","Lee el código de estado: 4xx apunta a la petición o a los permisos; 5xx, al servidor.","Revisa los logs del servidor en el momento del error."],interpret:["NXDOMAIN: el nombre no existe (error de escritura o registro faltante).","SERVFAIL o timeout de DNS: el servidor DNS no puede responder.","301/302 en bucle: redirecciones mal configuradas.","502/504: el proxy funciona, pero el servidor de detrás no responde a tiempo.","401: falta autenticación; 403: no tienes permiso."],differentiate:'Si la conexión TCP y TLS se completan (lo muestra `curl -v`) y recibes un código HTTP, la red está bien: el problema es de capa 7. Si el nombre no resuelve, también es capa 7 (DNS), aunque el síntoma parezca "no hay internet".'},quiz:[{q:"¿Chrome es un protocolo de capa 7?",options:["Sí, es la capa 7","No: es un programa que usa protocolos de capa 7 como HTTP y DNS","Es de capa 4","Es de capa 6"],answer:1,why:"La capa de aplicación son los protocolos, no los programas.",level:"Beginner"},{q:"Puedes hacer ping a 142.250.64.78 pero `google.com` no abre. ¿Dónde está el problema más probable?",options:["Capa 1","DNS (capa 7)","STP","MTU"],answer:1,why:"La conectividad IP funciona; falla la resolución de nombres.",level:"Beginner"},{q:"Diferencia entre 401 y 403:",options:["Son sinónimos","401: no autenticado; 403: autenticado sin permiso","401: servidor caído; 403: página no encontrada","403 es un error de DNS"],answer:1,why:"401 pide credenciales; 403 las rechaza por falta de permisos.",level:"Intermediate"},{q:"¿Qué registro DNS indica los servidores de correo de un dominio?",options:["A","CNAME","MX","PTR"],answer:2,why:"MX = Mail Exchanger. A es IPv4, CNAME es alias y PTR es resolución inversa.",level:"Beginner"},{q:"¿En qué capa se clasifica DHCP y por qué genera confusión?",options:["Capa 2, porque usa MAC","Capa 7 (aplicación sobre UDP 67/68), aunque su función es configurar parámetros de capa 3","Capa 4, porque usa UDP","Capa 1"],answer:1,why:"Es una aplicación que entrega IP, máscara, gateway y DNS.",level:"Intermediate"},{q:"¿Por qué no se debe usar Telnet para administrar un switch en producción?",options:["Porque es lento","Porque envía todo, incluidas las contraseñas, sin cifrar","Porque usa UDP","Porque no funciona en IPv4"],answer:1,why:"Cualquiera que capture el tráfico ve las credenciales. Se usa SSH.",level:"Beginner"},{q:"Un proxy inverso responde 502 Bad Gateway. ¿Qué significa?",options:["Que el usuario escribió mal la URL","Que el proxy no recibió una respuesta válida del servidor de backend","Que falta el certificado del cliente","Que DNS no resolvió"],answer:1,why:"El fallo está entre el proxy y el servidor que tiene detrás.",level:"Advanced"},{q:"¿Qué tres mecanismos ayudan a evitar que suplanten tu dominio en correos?",options:["ARP, NDP, ICMP","SPF, DKIM y DMARC","HSTS, CSP, CORS","STP, LACP, VTP"],answer:1,why:"SPF autoriza servidores, DKIM firma los mensajes y DMARC define qué hacer si fallan.",level:"Advanced"}],lab:{title:"Diseca una visita a una página web",where:"Tu navegador y terminal",goal:"Ver la capa 7 en acción: DNS, petición y respuesta HTTP, encabezados y códigos.",steps:["Ejecuta `nslookup example.com` y luego `nslookup example.com 1.1.1.1`. Compara servidores y respuestas.","Ejecuta `curl -I https://example.com` y anota el código de estado y los encabezados.","Ejecuta `curl -v http://github.com -o /dev/null` y observa la redirección 301 a HTTPS.","Abre DevTools → Network, recarga una página y haz clic en la primera petición: revisa Headers, Cookies y Timing.","Provoca un 404: visita una ruta que no exista y observa el código en Network.","Opcional: en Postman (o con curl) haz `GET https://jsonplaceholder.typicode.com/todos/1` y luego un `POST` a `/todos` con un JSON."],expected:"Verás el TTL de los registros DNS, la diferencia entre 200, 301 y 404, y en Timing cuánto tiempo se dedicó a DNS, conexión TCP, TLS y espera del servidor."}},Ke=[Jh,Zh,e1,a1,n1,t1,o1],U=e=>Ke[e-1],Zl=e=>e>=1&&e<=7?Ke[e-1].hex:"#9aa3b5",ns=[...Ke].reverse(),Dn=[{id:"osi",term:"Modelo OSI",layers:[0],def:"Modelo de referencia conceptual de la ISO (1984) que divide la comunicación de red en 7 capas con funciones definidas. No es un protocolo ni se implementa tal cual; sirve para estandarizar, enseñar, diseñar y diagnosticar.",example:'"Es un problema de capa 2" significa que está en el enlace local: MAC, switch o VLAN.'},{id:"tcpip",term:"Modelo TCP/IP",layers:[0],def:"El modelo que realmente usa Internet, con 4 capas: acceso a red, Internet, transporte y aplicación. Agrupa las capas OSI 1–2 en una y 5–7 en otra.",example:"HTTP, TLS y DNS forman parte de la capa de aplicación de TCP/IP."},{id:"pdu",term:"PDU",layers:[0],def:"Protocol Data Unit: el nombre de la unidad de datos en cada capa, formada por el encabezado de esa capa más los datos de la capa superior.",example:"Datos (7–5), segmento/datagrama (4), paquete (3), trama (2), bits (1)."},{id:"encapsulamiento",term:"Encapsulamiento",layers:[0],def:"Proceso en el que cada capa del emisor añade su encabezado (y la capa 2 también un tráiler) a los datos de la capa superior. El proceso inverso en el receptor es el desencapsulamiento.",example:"Un GET HTTP queda dentro de un segmento TCP, dentro de un paquete IP, dentro de una trama Ethernet."},{id:"payload",term:"Payload (carga útil)",layers:[0],def:"La parte de una PDU que transporta los datos de la capa superior, sin contar el encabezado propio. Lo que para una capa es payload, para la de arriba es su PDU completa.",example:"El payload de una trama Ethernet es un paquete IP."},{id:"header",term:"Encabezado (header)",layers:[0],def:"Información de control que una capa añade delante de los datos: direcciones, puertos, números de secuencia, tipos de protocolo. Lo lee la misma capa en el otro extremo.",example:"El encabezado IPv4 tiene 20 bytes sin opciones."},{id:"bit",term:"Bit",layers:[1],def:"La unidad mínima de información: 0 o 1. Es la PDU de la capa física, que lo convierte en una señal eléctrica, óptica o de radio.",example:"1 Gbps = mil millones de bits por segundo."},{id:"bandwidth",term:"Ancho de banda",layers:[1],def:"Capacidad máxima teórica de un enlace, en bits por segundo. No es la velocidad que se obtiene en la práctica.",example:"Un enlace Gigabit Ethernet tiene 1 Gbps de ancho de banda."},{id:"throughput",term:"Throughput",layers:[1,4],def:"Cantidad de datos útiles transferidos realmente por unidad de tiempo. Es menor que el ancho de banda por encabezados, retransmisiones, congestión e interferencia.",example:"Un speedtest que mide 62 Mbps en un plan de 100 Mbps."},{id:"latencia",term:"Latencia",layers:[1,3],def:"Tiempo que tarda un dato en ir de un punto a otro. Suele medirse como RTT (ida y vuelta) con ping, en milisegundos.",example:"15 ms a un servidor en la misma ciudad, 150 ms a otro continente."},{id:"jitter",term:"Jitter",layers:[1,3],def:"Variación de la latencia entre paquetes consecutivos. Afecta mucho a voz y video, que necesitan un ritmo constante.",example:"Pings de 20, 85, 22 y 110 ms indican jitter alto."},{id:"atenuacion",term:"Atenuación",layers:[1],def:"Pérdida de potencia de una señal a medida que recorre el medio. Limita la distancia máxima de cada tecnología.",example:"Por eso el UTP tiene un máximo de 100 m por tramo."},{id:"emi",term:"EMI (interferencia electromagnética)",layers:[1],def:"Ruido inducido en un cable por fuentes externas como motores, transformadores o cables de potencia. Provoca errores de bits. La fibra óptica es inmune.",example:"Un UTP junto a la máquina del aire acondicionado con errores CRC."},{id:"crosstalk",term:"Diafonía (crosstalk)",layers:[1],def:"Interferencia entre pares de un mismo cable: la señal de un par se induce en otro. El trenzado y las categorías superiores la reducen.",example:"Un conector mal ponchado con los pares destrenzados."},{id:"snr",term:"SNR (relación señal/ruido)",layers:[1],def:"Cociente entre la potencia de la señal y la del ruido, en decibelios. Una SNR baja obliga a usar modulaciones más lentas.",example:"Lejos del punto de acceso, el Wi-Fi baja de 866 a 130 Mbps."},{id:"modulacion",term:"Modulación",layers:[1],def:"Técnica que modifica la amplitud, frecuencia o fase de una onda portadora para representar bits. QAM combina amplitud y fase para meter varios bits por símbolo.",example:"Wi-Fi 6 usa OFDMA con hasta 1024-QAM."},{id:"utp",term:"UTP",layers:[1],def:"Unshielded Twisted Pair: cable de 4 pares trenzados sin blindaje, el más usado en LAN. Máximo 100 m por tramo.",example:"Un patch cord Cat6 entre la PC y la roseta."},{id:"rj45",term:"RJ-45",layers:[1],def:"Nombre común del conector modular de 8 posiciones (8P8C) que se usa con UTP. Su cableado sigue T568A o T568B.",example:"El conector del cable que llega a tu laptop."},{id:"fibra",term:"Fibra óptica",layers:[1],def:"Medio que transmite pulsos de luz por un núcleo de vidrio gracias a la reflexión interna total. Monomodo para largas distancias, multimodo para cortas. Inmune a EMI.",example:"El enlace entre dos edificios de un campus."},{id:"sfp",term:"SFP / SFP+ / QSFP",layers:[1],def:"Transceptores enchufables que adaptan un puerto de switch a fibra o cobre. SFP = 1 Gbps, SFP+ = 10 Gbps, QSFP+ = 40 Gbps, QSFP28 = 100 Gbps.",example:"Un módulo SFP+ 10GBASE-LR para fibra monomodo."},{id:"hub",term:"Hub",layers:[1],def:"Repetidor multipuerto que reenvía la señal por todos sus puertos sin entender direcciones. Forma un único dominio de colisión. Obsoleto.",example:"Si dos PCs del hub transmiten a la vez, hay colisión."},{id:"duplex",term:"Dúplex (half / full)",layers:[1,2],def:"Half-duplex: enviar o recibir, no ambos a la vez (necesita CSMA/CD en Ethernet). Full-duplex: enviar y recibir simultáneamente, sin colisiones.",example:"Un duplex mismatch causa colisiones tardías y errores CRC."},{id:"autoneg",term:"Autonegociación",layers:[1],def:"Proceso por el que los dos extremos Ethernet acuerdan velocidad y dúplex al conectarse. Si
