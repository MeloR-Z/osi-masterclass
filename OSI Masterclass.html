 un lado se fija a mano y el otro negocia, puede haber duplex mismatch.",example:'`show interfaces` muestra "Full-duplex, 1000Mb/s".'},{id:"mac",term:"Dirección MAC",layers:[2],def:"Dirección de capa 2 de 48 bits, plana, asignada a cada interfaz (los 3 primeros bytes identifican al fabricante). Solo sirve dentro de la red local y cambia en cada salto de router.",example:"00:1A:2B:3C:4D:5E."},{id:"oui",term:"OUI",layers:[2],def:"Organizationally Unique Identifier: los primeros 24 bits de una MAC, asignados por el IEEE a cada fabricante.",example:'Wireshark muestra "Cisco_3c:4d:5e" gracias al OUI.'},{id:"trama",term:"Trama (frame)",layers:[2],def:"PDU de la capa 2: encabezado con MAC destino, MAC origen y EtherType, los datos y un tráiler FCS. Mide entre 64 y 1518 bytes en Ethernet.",example:"Una trama Ethernet II que transporta un paquete IPv4."},{id:"ethertype",term:"EtherType",layers:[2],def:"Campo de 2 bytes de la trama Ethernet II que indica qué protocolo lleva dentro.",example:"0x0800 IPv4, 0x86DD IPv6, 0x0806 ARP, 0x8100 802.1Q."},{id:"fcs",term:"FCS / CRC",layers:[2],def:"Frame Check Sequence: tráiler de 4 bytes con un CRC-32 calculado sobre la trama. Si el receptor obtiene otro valor, la descarta. Detecta errores, no los corrige.",example:'Contadores "CRC" crecientes en una interfaz indican un medio defectuoso.'},{id:"switch",term:"Switch",layers:[2],def:"Dispositivo que aprende la MAC de origen de cada trama, consulta la MAC de destino en su tabla y reenvía solo por el puerto adecuado (o inunda si no la conoce). No modifica la trama.",example:"Un switch de 48 puertos en el cuarto de telecomunicaciones."},{id:"cam",term:"Tabla MAC (CAM)",layers:[2],def:"Tabla del switch que asocia cada MAC con un puerto y una VLAN. Las entradas dinámicas caducan tras un tiempo sin tráfico (300 s por defecto en Cisco).",example:"`show mac address-table`."},{id:"flooding",term:"Inundación (flooding)",layers:[2],def:"Comportamiento del switch cuando no conoce la MAC de destino (o es broadcast): envía la trama por todos los puertos de la VLAN salvo el de entrada.",example:"La primera trama hacia un equipo nuevo se inunda."},{id:"broadcast-domain",term:"Dominio de broadcast",layers:[2,3],def:"Conjunto de equipos que recibe una trama de broadcast. Un switch no lo divide (salvo con VLANs); un router sí.",example:"Cada VLAN es un dominio de broadcast."},{id:"collision-domain",term:"Dominio de colisión",layers:[1,2],def:"Conjunto de equipos cuyas transmisiones pueden chocar. En un hub es uno solo; en un switch, cada puerto es uno.",example:"Un switch de 24 puertos = 24 dominios de colisión."},{id:"vlan",term:"VLAN",layers:[2],def:"Red LAN virtual: divide un switch en varios dominios de broadcast lógicos. Comunicar VLANs requiere capa 3. No es lo mismo que una subred, aunque se suelen diseñar una a una.",example:"VLAN 10 Ventas, VLAN 20 Contabilidad."},{id:"trunk",term:"Trunk / 802.1Q",layers:[2],def:"Enlace que transporta varias VLANs, marcando cada trama con una etiqueta 802.1Q de 4 bytes (VLAN ID de 12 bits). La VLAN nativa viaja sin etiqueta.",example:"El enlace entre dos switches de distintos pisos."},{id:"access",term:"Puerto access",layers:[2],def:"Puerto de switch que pertenece a una sola VLAN y envía tramas sin etiqueta. Es el tipo de puerto donde se conectan los usuarios.",example:"`switchport access vlan 10`."},{id:"stp",term:"STP",layers:[2],def:"Spanning Tree Protocol (802.1D; RSTP es 802.1w): elige un root bridge y bloquea puertos redundantes para evitar bucles de capa 2 y tormentas de broadcast.",example:'Un puerto en estado "blocking" en `show spanning-tree`.'},{id:"lacp",term:"LACP / agregación de enlaces",layers:[2],def:"Protocolo que agrupa varios enlaces físicos en uno lógico (EtherChannel), sumando capacidad y redundancia.",example:"4 enlaces de 1 Gbps vistos como un Port-channel de 4 Gbps."},{id:"arp",term:"ARP",layers:[2,3],def:"Address Resolution Protocol: descubre la MAC que corresponde a una IPv4 en la red local, con una petición broadcast y una respuesta unicast. Viaja en tramas (EtherType 0x0806). Su clasificación está entre la capa 2 y la 3.",example:'"Who has 192.168.1.1? Tell 192.168.1.10".'},{id:"ndp",term:"NDP",layers:[3],def:"Neighbor Discovery Protocol de IPv6: reemplaza a ARP con mensajes ICMPv6 enviados a direcciones multicast. También descubre routers y permite SLAAC.",example:"Neighbor Solicitation / Neighbor Advertisement."},{id:"csma",term:"CSMA/CD y CSMA/CA",layers:[2],def:"Métodos de acceso a un medio compartido. CD (Ethernet half-duplex) detecta colisiones y reintenta; CA (Wi-Fi) intenta evitarlas antes de transmitir.",example:"En full-duplex, CSMA/CD no se usa."},{id:"ip",term:"Dirección IP",layers:[3],def:"Dirección lógica y jerárquica de capa 3 (red + host) que identifica a una interfaz para el enrutamiento. Se mantiene de extremo a extremo, salvo NAT.",example:"192.168.1.10/24 o 2001:db8::10/64."},{id:"ipv4",term:"IPv4",layers:[3],def:"Versión 4 del protocolo IP: direcciones de 32 bits, encabezado de 20 bytes sin opciones, con TTL y checksum. El espacio de direcciones está agotado.",example:"8.8.8.8."},{id:"ipv6",term:"IPv6",layers:[3],def:"Versión 6 de IP: direcciones de 128 bits, encabezado fijo de 40 bytes, sin broadcast ni checksum, con Hop Limit en lugar de TTL y NDP en lugar de ARP.",example:"2001:db8::1, fe80::1 (link-local)."},{id:"paquete",term:"Paquete",layers:[3],def:"PDU de la capa 3: encabezado IP con direcciones de origen y destino más la carga (segmento, datagrama o mensaje ICMP).",example:"Un paquete IPv4 con protocolo 6 (TCP)."},{id:"mascara",term:"Máscara de subred",layers:[3],def:"Valor de 32 bits que indica qué parte de una IPv4 es la red y cuál el host. Se escribe en decimal (255.255.255.0) o como prefijo CIDR (/24).",example:"192.168.1.10 AND 255.255.255.0 = 192.168.1.0."},{id:"cidr",term:"CIDR",layers:[3],def:"Classless Inter-Domain Routing: notación /n y sistema de asignación que permite prefijos de cualquier longitud, sin clases A/B/C.",example:"10.20.0.0/22 contiene 1024 direcciones."},{id:"subred",term:"Subred",layers:[3],def:"Rango de direcciones IP que comparten el mismo prefijo de red. Los equipos de una misma subred se comunican directamente; para otras subredes necesitan un router.",example:"192.168.10.0/24."},{id:"gateway",term:"Default gateway",layers:[3],def:"Router al que un equipo envía los paquetes destinados a otras redes. Debe estar en la misma subred que el equipo.",example:"192.168.1.1 en una red doméstica."},{id:"router",term:"Router",layers:[3],def:"Dispositivo que reenvía paquetes entre redes según la IP de destino y su tabla de enrutamiento. Decrementa el TTL, reconstruye la trama en cada salto y separa dominios de broadcast.",example:"El router de tu casa conecta tu LAN con el ISP."},{id:"routing-table",term:"Tabla de enrutamiento",layers:[3],def:"Lista de prefijos de destino con su siguiente salto o interfaz de salida, origen y métrica. Se elige la coincidencia de prefijo más largo.",example:"`show ip route`, `ip route`, `route print`."},{id:"lpm",term:"Longest prefix match",layers:[3],def:"Regla de enrutamiento: entre todas las rutas que contienen el destino, se elige la de prefijo más largo, que es la más específica.",example:"Para 10.1.5.9 gana 10.1.5.0/24 sobre 10.0.0.0/8."},{id:"default-route",term:"Ruta por defecto",layers:[3],def:"La ruta 0.0.0.0/0 (o ::/0): coincide con cualquier destino y se usa cuando no existe otra más específica.",example:'"Gateway of last resort" en Cisco.'},{id:"ttl",term:"TTL / Hop Limit",layers:[3],def:"Campo que cada router decrementa en 1. Si llega a 0, el paquete se descarta y se envía ICMP Time Exceeded. Evita bucles infinitos y es la base de traceroute.",example:"Linux suele iniciar con TTL 64; Windows con 128."},{id:"icmp",term:"ICMP",layers:[3],def:"Protocolo de mensajes de control y error de IP: echo (ping), destino inalcanzable, tiempo excedido, fragmentación necesaria.",example:"Tipo 8 = Echo Request, tipo 0 = Echo Reply."},{id:"nat",term:"NAT / PAT",layers:[3,4],def:"Traducción de direcciones. PAT (NAT overload) permite que muchos equipos privados compartan una IP pública diferenciándolos por el puerto de origen.",example:"192.168.1.10:52000 ↔ 203.0.113.5:61001."},{id:"privada",term:"IP privada / pública",layers:[3],def:"Privadas (RFC 1918: 10/8, 172.16/12, 192.168/16) no se enrutan en Internet. Públicas son únicas globalmente.",example:"Tu PC tiene 192.168.1.10; tu router sale con una pública."},{id:"loopback",term:"Loopback",layers:[3],def:"Dirección que apunta al propio equipo: 127.0.0.0/8 en IPv4 y ::1 en IPv6. El tráfico no sale a la red.",example:"`ping 127.0.0.1` prueba el stack TCP/IP local."},{id:"apipa",term:"APIPA / link-local",layers:[3],def:"Dirección 169.254.0.0/16 que se autoasigna un equipo cuando no obtiene respuesta de DHCP. En IPv6, fe80::/10 existe siempre en cada interfaz.",example:"IP 169.254.33.7: revisar DHCP."},{id:"multicast",term:"Multicast",layers:[2,3],def:"Envío a un grupo de equipos suscritos. IPv4 usa 224.0.0.0/4; IPv6 usa ff00::/8 y lo emplea en lugar del broadcast.",example:"OSPF habla con 224.0.0.5."},{id:"broadcast",term:"Broadcast",layers:[2,3],def:"Envío a todos los equipos del dominio de broadcast. En capa 2 la MAC es FF:FF:FF:FF:FF:FF. IPv6 no lo tiene.",example:"DHCP Discover y ARP Request."},{id:"mtu",term:"MTU",layers:[2,3],def:"Maximum Transmission Unit: tamaño máximo del paquete IP que cabe en una trama de un enlace. En Ethernet, 1500 bytes.",example:"PPPoE reduce la MTU a 1492."},{id:"pmtud",term:"Path MTU Discovery",layers:[3],def:'Mecanismo por el que el origen descubre la MTU mínima del camino gracias a los ICMP "Fragmentation needed" / "Packet Too Big". Si se bloquea ICMP, aparecen conexiones colgadas.',example:"ping -f -l 1472 8.8.8.8."},{id:"fragmentacion",term:"Fragmentación IP",layers:[3],def:"División de un paquete IPv4 demasiado grande en fragmentos que el destino reensambla. Los routers IPv6 no fragmentan.",example:"Campos Identification, MF y Fragment Offset."},{id:"ospf",term:"OSPF",layers:[3],def:"Protocolo de enrutamiento interior de estado de enlace: cada router conoce la topología del área y calcula el camino más corto con Dijkstra. Va sobre IP (protocolo 89).",example:"Enrutamiento entre la sede y las sucursales."},{id:"bgp",term:"BGP",layers:[3],def:"Border Gateway Protocol: intercambia rutas entre sistemas autónomos y decide por políticas. Corre sobre TCP 179. Es el protocolo que une Internet.",example:"Un ISP anuncia sus prefijos a sus vecinos."},{id:"rip",term:"RIP",layers:[3],def:"Protocolo de vector distancia histórico: métrica en saltos (máximo 15), actualizaciones periódicas por UDP 520 y convergencia lenta.",example:"Usado en laboratorios del CCNA para comparar con OSPF."},{id:"segmento",term:"Segmento",layers:[4],def:"PDU de TCP: encabezado TCP (20–60 bytes) con puertos, secuencias, ACK, flags y ventana, más los datos.",example:"Un segmento [PSH, ACK] con un GET HTTP."},{id:"datagrama",term:"Datagrama",layers:[4,3],def:'PDU de UDP (encabezado de 8 bytes). En algunos textos también se llama datagrama al paquete IP, por eso conviene precisar "datagrama UDP".',example:"Una consulta DNS en un datagrama UDP al puerto 53."},{id:"puerto",term:"Puerto",layers:[4],def:"Número de 16 bits que identifica a un proceso dentro de un equipo. Conocidos 0–1023, registrados 1024–49151, dinámicos 49152–65535.",example:"HTTPS escucha en 443; tu navegador sale desde 52314."},{id:"socket",term:"Socket",layers:[4],def:"Extremo de comunicación definido por IP + puerto + protocolo. Una conexión TCP se identifica por la tupla de 5 (protocolo, IP y puerto de origen y de destino).",example:"192.168.1.10:52314 → 142.250.64.78:443 / TCP."},{id:"tcp",term:"TCP",layers:[4],def:"Protocolo de transporte orientado a conexión y fiable: handshake, números de secuencia, ACKs, retransmisiones, control de flujo y de congestión.",example:"HTTP/1.1, HTTP/2, SSH, SMTP."},{id:"udp",term:"UDP",layers:[4],def:"Protocolo de transporte sin conexión: solo puertos, longitud y checksum. Rápido, sin garantías de entrega ni orden.",example:"DNS, DHCP, VoIP, juegos, QUIC."},{id:"handshake",term:"Three-way handshake",layers:[4],def:"Apertura de una conexión TCP: SYN (cliente), SYN-ACK (servidor), ACK (cliente). Sincroniza números de secuencia y negocia opciones.",example:"Las tres primeras líneas de una conexión en Wireshark."},{id:"syn",term:"SYN",layers:[4],def:"Flag TCP que pide abrir una conexión y sincronizar el número de secuencia inicial.",example:"Un SYN sin respuesta termina en timeout."},{id:"ack",term:"ACK",layers:[4],def:"Flag TCP que indica que el número de acuse es válido; el valor indica el siguiente byte que se espera. Es acumulativo.",example:'ack=2001 = "recibí todo hasta el byte 2000".'},{id:"fin",term:"FIN",layers:[4],def:"Flag TCP que indica que un lado terminó de enviar datos. El cierre ordenado usa FIN y ACK en cada sentido.",example:"[FIN, ACK] al final de una descarga."},{id:"rst",term:"RST",layers:[4],def:"Flag TCP que aborta una conexión de inmediato o rechaza un intento de conexión a un puerto cerrado.",example:'SYN → RST = "connection refused".'},{id:"psh-urg",term:"PSH y URG",layers:[4],def:"PSH pide entregar ya los datos a la aplicación. URG marca datos urgentes con el puntero urgente; está prácticamente en desuso.",example:"[PSH, ACK] en segmentos con datos de aplicación."},{id:"seq",term:"Número de secuencia",layers:[4],def:"Campo de 32 bits de TCP que indica la posición del primer byte de datos del segmento. TCP numera bytes, no segmentos. El inicial (ISN) es aleatorio.",example:"seq=1001, len=500 → el siguiente es seq=1501."},{id:"ventana",term:"Ventana TCP / sliding window",layers:[4],def:"Cantidad de bytes que el receptor puede aceptar (control de flujo). La ventana avanza a medida que llegan ACKs, permitiendo enviar varios segmentos sin esperar uno por uno.",example:"[TCP ZeroWindow]: el receptor pide pausar."},{id:"congestion",term:"Control de congestión",layers:[4],def:"Mecanismo por el que TCP limita su ritmo según el estado de la red, con una ventana de congestión (slow start, congestion avoidance). Algoritmos: Reno, CUBIC, BBR.",example:"Una descarga que acelera poco a poco al principio."},{id:"retransmision",term:"Retransmisión",layers:[4],def:"Reenvío de un segmento cuyo ACK no llegó a tiempo (RTO) o tras tres ACKs duplicados (fast retransmit).",example:"[TCP Retransmission] en Wireshark."},{id:"mss",term:"MSS",layers:[4],def:"Maximum Segment Size: máximo de datos TCP por segmento, sin encabezados. Se anuncia en el SYN. Con MTU 1500 e IPv4: 1460.",example:"MSS clamping en routers con túneles."},{id:"time-wait",term:"TIME_WAIT",layers:[4],def:"Estado en el que queda quien cierra primero una conexión TCP durante 2×MSL, para absorber segmentos atrasados y reenviar el último ACK.",example:"Cientos de sockets TIME_WAIT en un servidor web activo."},{id:"quic",term:"QUIC",layers:[4,5,6],def:"Protocolo de transporte cifrado sobre UDP, con TLS 1.3 integrado, varios streams independientes y Connection IDs. Base de HTTP/3.",example:"Chrome usando HTTP/3 con Google por UDP 443."},{id:"sesion",term:"Sesión",layers:[5],def:"Diálogo lógico entre aplicaciones con un identificador propio, que puede abarcar varias conexiones de transporte y sobrevivir a interrupciones.",example:"Una sesión web identificada por una cookie."},{id:"stateless",term:"Stateful / stateless",layers:[5,7],def:"Stateful: el servidor guarda el contexto entre peticiones. Stateless: cada petición trae todo lo necesario. HTTP es stateless; TCP es stateful.",example:"APIs REST con tokens Bearer."},{id:"checkpoint",term:"Checkpoint (sincronización)",layers:[5],def:"Punto de control en un diálogo largo que permite retomar desde ahí tras un fallo, sin empezar de cero.",example:"Reanudar una descarga con el encabezado HTTP Range."},{id:"cookie",term:"Cookie",layers:[7,5],def:"Pequeño dato que el servidor envía con Set-Cookie y el navegador devuelve con Cookie en cada petición. Implementa sesiones sobre un HTTP stateless.",example:"sessionid=...; Secure; HttpOnly; SameSite=Lax."},{id:"encoding",term:"Codificación (encoding)",layers:[6],def:"Transformar datos a otra representación de forma reversible y sin clave. No aporta confidencialidad.",example:"Base64, UTF-8, URL encoding (%20)."},{id:"utf8",term:"UTF-8",layers:[6],def:"Codificación de Unicode de 1 a 4 bytes por carácter, compatible con ASCII. La dominante en la web.",example:'"ñ" = C3 B1.'},{id:"ascii",term:"ASCII",layers:[6],def:"Código de 7 bits (0–127) para letras inglesas, dígitos y símbolos. Base de UTF-8.",example:'"A" = 65 = 0x41.'},{id:"base64",term:"Base64",layers:[6],def:"Codificación que representa binario con 64 caracteres de texto. Aumenta el tamaño un 33 %. Cualquiera la decodifica.",example:'"hola" → aG9sYQ==.'},{id:"cifrado",term:"Cifrado (encryption)",layers:[6],def:"Transformación reversible solo con una clave. Simétrico (AES, ChaCha20) para los datos; asimétrico (RSA, ECC) para intercambiar claves y firmar.",example:"TLS cifra el tráfico HTTPS con AES-GCM."},{id:"hash",term:"Hash",layers:[6],def:"Función que produce una huella de tamaño fijo y no reversible. Un cambio mínimo en la entrada cambia toda la salida. Para contraseñas se usan hashes lentos con sal.",example:"SHA-256, bcrypt, Argon2."},{id:"compresion",term:"Compresión",layers:[6],def:"Reducir el tamaño de los datos eliminando redundancia. Sin pérdida (gzip, Brotli) o con pérdida (JPEG, MP3). Se comprime antes de cifrar.",example:"Content-Encoding: br."},{id:"serializacion",term:"Serialización",layers:[6],def:"Convertir una estructura en memoria en bytes transmisibles, y viceversa.",example:"JSON, XML, Protocol Buffers, ASN.1/DER."},{id:"asn1",term:"ASN.1",layers:[6],def:"Notación formal para describir estructuras de datos, con codificaciones binarias (BER, DER). Usada en certificados X.509, SNMP, LDAP.",example:"Un certificado .cer en DER."},{id:"mime",term:"MIME",layers:[6,7],def:"Estándar de tipos de contenido y codificación de mensajes multiparte. HTTP lo usa en Content-Type.",example:"application/json; charset=utf-8."},{id:"tls",term:"TLS",layers:[6,5,4],def:"Transport Layer Security: protocolo que aporta cifrado, integridad y autenticación (certificados). Se enseña en la capa 6, pero corre sobre TCP, debajo de la aplicación, y tiene funciones de sesión.",example:"HTTPS = HTTP sobre TLS."},{id:"certificado",term:"Certificado X.509",layers:[6],def:"Documento firmado por una autoridad (CA) que asocia una clave pública con un nombre de dominio. El cliente lo verifica en el handshake TLS.",example:"CN=www.example.org, emitido por DigiCert."},{id:"sni",term:"SNI",layers:[6,7],def:"Server Name Indication: extensión del ClientHello de TLS que indica el nombre del sitio. Viaja visible salvo con ECH.",example:"Permite varios sitios HTTPS en una misma IP."},{id:"http",term:"HTTP",layers:[7],def:"Protocolo de la web: peticiones con método, ruta y encabezados; respuestas con código de estado. Stateless.",example:"GET /index.html HTTP/1.1."},{id:"https",term:"HTTPS",layers:[7,6],def:"HTTP protegido por TLS, normalmente en el puerto 443.",example:"https://banco.ejemplo.com."},{id:"status",term:"Código de estado HTTP",layers:[7],def:"Número de 3 dígitos de la respuesta: 1xx informativo, 2xx éxito, 3xx redirección, 4xx error del cliente, 5xx error del servidor.",example:"200 OK, 301, 404, 502."},{id:"metodo",term:"Método HTTP",layers:[7],def:"Acción que pide el cliente: GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS.",example:"POST /login."},{id:"api",term:"API / REST",layers:[7],def:"API: contrato para que un programa use servicios de otro. REST: estilo que expone recursos por URL y los manipula con métodos HTTP, de forma stateless.",example:"GET /v1/usuarios/42."},{id:"dns",term:"DNS",layers:[7],def:"Sistema que traduce nombres de dominio a IPs mediante resolvers recursivos y servidores autoritativos. UDP/TCP 53.",example:"example.com → 93.184.215.14."},{id:"dns-records",term:"Registros DNS",layers:[7],def:"A (IPv4), AAAA (IPv6), CNAME (alias), MX (correo), NS (autoritativos), TXT (texto, SPF/DKIM), PTR (inversa), SOA (zona).",example:"dig MX gmail.com."},{id:"dhcp",term:"DHCP",layers:[7,3],def:"Protocolo de aplicación (UDP 67/68) que asigna IP, máscara, gateway y DNS mediante DORA: Discover, Offer, Request, Ack.",example:"ipconfig /renew."},{id:"smtp",term:"SMTP",layers:[7],def:"Protocolo para enviar y transferir correo (25 entre servidores, 587 para envío autenticado).",example:"EHLO, MAIL FROM, RCPT TO, DATA."},{id:"imap",term:"IMAP",layers:[7],def:"Protocolo para acceder al buzón en el servidor y sincronizarlo desde varios dispositivos (143, o 993 con TLS).",example:"Leer el correo del trabajo en el móvil y la PC."},{id:"ssh",term:"SSH",layers:[7],def:"Acceso remoto cifrado (TCP 22) con autenticación por contraseña o clave pública. También SFTP y túneles.",example:"ssh admin@10.0.0.1."},{id:"telnet",term:"Telnet",layers:[7],def:"Terminal remota sin cifrado (TCP 23). Las credenciales viajan en claro.",example:"Solo para laboratorios o probar si un puerto responde."},{id:"ftp",term:"FTP",layers:[7],def:"Transferencia de archivos con conexiones de control (21) y datos separadas, sin cifrar. Reemplazado por SFTP o FTPS.",example:"Servidores heredados."},{id:"snmp",term:"SNMP",layers:[7],def:"Protocolo de gestión (UDP 161, traps 162) para leer y modificar variables de dispositivos. v3 añade autenticación y cifrado.",example:"Un NMS que grafica el tráfico de cada puerto."},{id:"ntp",term:"NTP",layers:[7],def:"Sincronización de relojes (UDP 123). Crítico para logs, certificados y Kerberos.",example:"w32tm /query /status."},{id:"websocket",term:"WebSocket",layers:[7],def:"Canal bidireccional persistente que empieza como HTTP con Upgrade (respuesta 101).",example:"wss:// en un chat en tiempo real."},{id:"firewall",term:"Firewall",layers:[3,4,7],def:"Filtra tráfico según reglas. Stateless (paquete a paquete), stateful (sigue conexiones) o de nueva generación (identifica aplicaciones, capa 7).",example:"Permitir TCP 443 entrante solo hacia el servidor web."},{id:"ids",term:"IDS / IPS",layers:[0],def:"Sistemas que detectan (IDS) o bloquean (IPS) tráfico malicioso por firmas o anomalías.",example:"Suricata, Snort, Zeek."},{id:"mitm",term:"Man-in-the-middle",layers:[0],def:"Ataque en el que alguien se interpone entre dos partes para leer o modificar el tráfico, por ejemplo con ARP spoofing o un certificado falso.",example:"Un atacante en un Wi-Fi público."},{id:"8021x",term:"802.1X / NAC",layers:[2],def:"Autenticación por puerto: el switch o el AP no da acceso a la red hasta que el equipo se autentica contra un servidor (RADIUS).",example:"WPA2-Enterprise en una oficina."},{id:"dai",term:"DHCP snooping y DAI",layers:[2],def:"DHCP snooping solo permite respuestas DHCP desde puertos de confianza y construye una tabla IP–MAC–puerto. Dynamic ARP Inspection usa esa tabla para descartar ARP falsos.",example:"Mitigan servidores DHCP falsos y ARP spoofing."}],Rp=[{name:"Wireshark",layers:[1,2,3,4,5,6,7],purpose:"Captura y analiza paquetes con decodificación completa de cientos de protocolos.",when:"Cuando necesitas ver qué pasa realmente en el cable: handshakes, retransmisiones, DNS, ARP.",cmds:[["ip.addr == 10.0.0.5","Tráfico de/hacia una IP"],["tcp.port == 443","Un puerto TCP"],["dns","Solo DNS"],["tcp.flags.syn == 1 && tcp.flags.ack == 0","Solo SYN iniciales"],["tcp.analysis.retransmission","Retransmisiones"],["arp || icmp","ARP o ICMP"]],sample:`No.  Time      Source        Destination   Protocol Info
5    0.0244    192.168.1.37  93.184.215.14 TCP      52314 → 443 [SYN]
6    0.0412    93.184.215.14 192.168.1.37  TCP      443 → 52314 [SYN, ACK]`,interpret:["Columna Protocol: el protocolo más alto que Wireshark reconoció.","Panel de detalles: una línea por capa, de la física a la de aplicación.","Statistics → Conversations y → IO Graphs para ver el panorama."]},{name:"tcpdump",layers:[2,3,4],purpose:"Captura de paquetes en la terminal, ideal para servidores sin interfaz gráfica.",when:"En un servidor Linux remoto; para guardar un .pcap y abrirlo luego en Wireshark.",cmds:[["tcpdump -ni eth0 port 53","DNS en eth0"],["tcpdump -ni eth0 -e arp","ARP mostrando MACs"],["tcpdump -ni any host 10.0.0.5 -w cap.pcap","Guardar a archivo"]],sample:"21:22:03.118 IP 192.168.1.37.58231 > 8.8.8.8.53: 16149+ A? example.com. (29)",interpret:["Formato: hora, protocolo, origen.puerto > destino.puerto, detalle.","`Flags [S]` = SYN, `[S.]` = SYN-ACK, `[.]` = ACK, `[R]` = RST, `[F.]` = FIN-ACK, `[P.]` = PSH-ACK."]},{name:"Nmap",layers:[3,4,7],purpose:"Descubrimiento de hosts, puertos y servicios. Solo en redes propias o con autorización por escrito.",when:"Auditorías autorizadas, inventario, verificar qué expone un servidor.",cmds:[["nmap -sn 192.168.1.0/24","Descubrir hosts activos"],["nmap -sS -p- 10.0.0.5","SYN scan de todos los puertos"],["nmap -sV -p 22,80,443 10.0.0.5","Versiones de servicios"],["nmap -sU -p 53,161 10.0.0.5","Escaneo UDP"]],sample:`PORT    STATE    SERVICE

as (2 y 3), aunque se suelen diseñar una a una","La subred es de capa 2","La VLAN es de capa 3"],answer:1,why:"VLAN = dominio de broadcast; subred = rango de IPs."},{cat:"Protocolos",q:"¿Qué protocolo usa una consulta DNS normal y en qué puerto?",options:["TCP 80","UDP 53","UDP 67","TCP 443"],answer:1,why:"UDP 53; TCP 53 para respuestas grandes y transferencias de zona."},{cat:"Protocolos",q:"¿Qué reemplaza a ARP en IPv6?",options:["DHCPv6","NDP (ICMPv6)","RARP","IGMP"],answer:1,why:"Neighbor Discovery usa ICMPv6 y multicast."},{cat:"Protocolos",q:"QUIC corre sobre...",options:["TCP","UDP","IP directamente","TLS sobre TCP"],answer:1,why:"QUIC va sobre UDP e integra TLS 1.3."},{cat:"Protocolos",q:"¿Cuál es la diferencia entre MTU y MSS?",options:["Son iguales","MTU = paquete IP máximo del enlace; MSS = datos TCP máximos por segmento","MSS es de capa 2","MTU solo existe en Wi-Fi"],answer:1,why:"MSS típico = 1500 − 20 − 20 = 1460."},{cat:"Protocolos",q:"DHCP se clasifica en...",options:["Capa 2","Capa 7, aunque configura parámetros de capa 3","Capa 4","Capa 1"],answer:1,why:"Es una aplicación sobre UDP 67/68."},{cat:"Troubleshooting",q:"Una PC tiene IP 169.254.10.5. ¿Primer sospechoso?",options:["DNS","DHCP no respondió (VLAN, servidor o relay)","MTU","TLS"],answer:1,why:"APIPA aparece cuando no llega respuesta DHCP."},{cat:"Troubleshooting",q:"ping 8.8.8.8 funciona, ping google.com no. ¿Capa?",options:["1","3","7 (DNS)","2"],answer:2,why:"La conectividad IP existe; falla la resolución."},{cat:"Troubleshooting",q:'"Connection refused" al instante vs. "timeout" tras 20 s:',options:["Ambos son DNS","Refused = RST (host alcanzable, puerto cerrado); timeout = sin respuesta (filtrado o sin ruta)","Refused = firewall; timeout = servicio caído","No hay diferencia"],answer:1,why:"El tipo de error dice mucho de dónde está el problema."},{cat:"Troubleshooting",q:'Interfaz Cisco "up/down". ¿Dónde miras?',options:["Capa 1: cable","Capa 2: encapsulación, keepalives, protocolo de enlace","Capa 7","DNS"],answer:1,why:"Hay señal (up) pero el protocolo de línea falla (down)."},{cat:"Troubleshooting",q:"La pérdida en mtr aparece solo en el salto 4 y no en el 5 ni en el destino. ¿Conclusión?",options:["El salto 4 está caído","El router 4 limita sus respuestas ICMP; no hay pérdida real hacia el destino","Hay que cambiar el cable","Es un problema de DNS"],answer:1,why:"La pérdida real se arrastra hasta el destino."},{cat:"Paquetes",q:"En Wireshark ves IP destino 8.8.8.8 y MAC destino 00:1e:58:4a:c1:02. ¿De quién es esa MAC?",options:["De Google","Del default gateway","Del servidor DNS","Es broadcast"],answer:1,why:"La trama va al siguiente salto."},{cat:"Paquetes",q:"Un segmento muestra Flags [S.] en tcpdump. ¿Qué es?",options:["SYN","SYN-ACK","RST","FIN"],answer:1,why:"S = SYN y el punto = ACK."},{cat:"Paquetes",q:"Un paquete ARP en Wireshark no muestra encabezado IP. ¿Por qué?",options:["Error de captura","Porque ARP viaja directamente en una trama Ethernet (EtherType 0x0806)","Porque está cifrado","Porque es IPv6"],answer:1,why:"ARP no va dentro de IP."},{cat:"Paquetes",q:'Un Client Hello de TLS muestra "server_name: banco.com". ¿Qué implica?',options:["Que la contraseña es visible","Que el nombre del sitio es visible para observadores de la red (SNI), aunque el contenido vaya cifrado","Que no hay TLS","Que es HTTP/1.0"],answer:1,why:"El SNI viaja en claro salvo con ECH."},{cat:"Comandos",q:"¿Qué comando de Linux muestra qué proceso escucha en cada puerto?",options:["ip route","ss -tulpn","arp -a","dig"],answer:1,why:"t TCP, u UDP, l listening, p proceso, n numérico."},{cat:"Comandos",q:"¿Qué comando de PowerShell prueba si se completa el handshake TCP a un puerto?",options:["ipconfig /all","Test-NetConnection host -Port 443","route print","nslookup"],answer:1,why:"Muestra TcpTestSucceeded."},{cat:"Comandos",q:"¿Por qué nslookup puede devolver una IP correcta mientras las aplicaciones usan otra?",options:["Porque nslookup usa IPv6","Porque nslookup consulta directamente al servidor DNS y no usa el archivo hosts ni la caché del sistema","Porque nslookup usa TCP","Es imposible"],answer:1,why:"Hosts y caché tienen prioridad para el resto del sistema."},{cat:"Escenarios",q:"Equipos de la VLAN 20 no llegan a su gateway en el switch núcleo, pero se ven entre ellos. ¿Qué revisas primero?",options:["El certificado TLS","Que la VLAN 20 esté permitida en el trunk hacia el núcleo","El DNS","La categoría del cable"],answer:1,why:"Dentro de la VLAN no se usa el trunk; para llegar al gateway sí."},{cat:"Escenarios",q:"El servidor recibe SYN y responde SYN-ACK, pero el cliente reintenta SYN. ¿Qué sospechas?",options:["El servicio no escucha","El SYN-ACK se pierde en el regreso (ruta asimétrica o firewall)","DNS","Certificado caducado"],answer:1,why:"La ida llega; la vuelta no."},{cat:"Escenarios",q:"Las descargas grandes se cuelgan pero las páginas pequeñas cargan, y hay un túnel VPN. ¿Qué sospechas?",options:["Problema de MTU / PMTUD (ICMP bloqueado)","DNS","Cable dañado","Falta de cookies"],answer:0,why:'Paquetes grandes con DF se pierden si no llega el ICMP "fragmentation needed".'},{cat:"Cybersecurity",q:"Ves dos IPs (gateway y un PC) con la misma MAC en la caché ARP de varias víctimas. ¿Qué control lo mitiga?",options:["HSTS","Dynamic ARP Inspection con DHCP snooping","SPF","NAT"],answer:1,why:"DAI descarta ARP que no coinciden con la tabla de DHCP snooping."},{cat:"Cybersecurity",q:"En un SYN scan, ¿qué estado reporta Nmap si no recibe ninguna respuesta?",options:["open","closed","filtered","unknown"],answer:2,why:"Sin SYN-ACK ni RST, algo filtra el tráfico."},{cat:"Cybersecurity",q:'Un desarrollador "protege" contraseñas codificándolas en Base64. ¿Qué le dices?',options:["Está bien","Base64 es codificación reversible sin clave; debe usar TLS en tránsito y un hash lento con sal (bcrypt/Argon2) para almacenar","Debe usar MD5","Debe usar ROT13"],answer:1,why:"Codificar no es cifrar ni hashear."},{cat:"Cybersecurity",q:"¿Qué indicador sugiere DNS tunneling?",options:["Consultas cortas a google.com","Muchas consultas TXT a subdominios largos y aleatorios de un mismo dominio","Un TTL de 300","Respuestas NOERROR"],answer:1,why:"Los datos se codifican dentro de los nombres consultados."},{cat:"Cybersecurity",q:"Bloquear TODO el ICMP en el firewall perimetral...",options:["No tiene ningún efecto","Puede romper Path MTU Discovery y dificultar el diagnóstico; mejor filtrar y limitar por tipos","Mejora el rendimiento","Es obligatorio"],answer:1,why:"ICMP tiene mensajes de control necesarios."}],s1=[{front:"Orden de las capas de la 1 a la 7",back:'Física, Enlace de datos, Red, Transporte, Sesión, Presentación, Aplicación. "Please Do Not Throw Sausage Pizza Away".',layer:0},{front:"PDU de cada capa",back:"Bits (1), trama (2), paquete (3), segmento TCP / datagrama UDP (4), datos (5–7).",layer:0},{front:"Refused vs. timeout",back:"Refused: llegó RST (host alcanzable, puerto cerrado). Timeout: no llegó nada (filtrado, caído o sin ruta).",layer:4},{front:"down/down vs up/down (Cisco)",back:"down/down: capa 1 (no hay señal). up/down: capa 2 (protocolo de enlace). administratively down: shutdown.",layer:1},{front:"¿Qué cambia en cada salto de router?",back:"MAC de origen y destino, TTL (−1), checksum IPv4 y FCS. Con NAT también IP/puerto de origen.",layer:3},{front:'Orden de troubleshooting de "no hay Internet"',back:"Enlace → IP/máscara/gateway → ping gateway → ping 8.8.8.8 → ping por nombre (DNS) → puerto → aplicación.",layer:0}],sa=[{id:"s1",title:"No puedo abrir una página web",level:"Beginner",ticket:'Ana (contabilidad): "Desde esta mañana no me abre ninguna página. Ayer funcionaba."',context:["PC Windows 11 por cable","Red 192.168.10.0/24, gateway 192.168.10.1","Sus compañeros de al lado navegan sin problema"],hints:["Empieza desde abajo: ¿hay enlace físico?","Mira con atención la primera línea del adaptador en ipconfig.","Si un compañero funciona en el mismo switch, compara la luz de los dos puertos."],commands:[{cmd:"ipconfig",output:`Adaptador de Ethernet Ethernet:
